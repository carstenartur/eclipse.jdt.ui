name: Standalone SDK template consumers
on:
  push:
    branches: [qa/fix-sdk-ci-20260922]
    paths: [.github/workflows/sdk-standalone-validation.yml]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MAVEN_OPTS: -Xmx4g
      GDK_BACKEND: x11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 660e48c54e9035cb386743bd1bbbbd645c6bfc1a
          fetch-depth: 0
          path: jdt-ui
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check out the unchanged published companion commits
        run: |
          set -euo pipefail
          mkdir evidence
          for item in 'carstenartur/eclipse.jdt.debug debug c37a60078154eb9d98c071dad720fdbefffdf31c' 'carstenartur/eclipse.pde pde ff9dbd96c7a068fd62a0af2e03acd6f94f9026bd' 'eclipse-jdt/eclipse.jdt jdt-feature 36db39a9a02496f1feb6f7d5d7a589c6a7280f03'; do
            read -r repo name sha <<< "$item"
            git clone -q --filter=blob:none --no-checkout "https://github.com/$repo.git" "$name"
            git -C "$name" checkout -q --detach "$sha"
            test "$(git -C "$name" rev-parse HEAD)" = "$sha"
          done
          for name in jdt-ui debug pde jdt-feature; do echo "$name $(git -C "$name" rev-parse HEAD)"; done | tee evidence/source-shas.txt
      - name: Stage and test the provider in the local Tycho repository
        run: |
          set -euo pipefail
          cd jdt-ui
          xvfb-run -a mvn -B -ntp -Pbuild-individual-bundles -Dcompare-version-with-baselines.skip=false -DtestClass=org.eclipse.jdt.text.tests.templates.TemplateContributionTest -DfailIfNoTests=false -pl org.eclipse.jdt.text.tests -am install > ../evidence/provider.log 2>&1
          tail -30 ../evidence/provider.log
      - name: Build Debug independently, without the provider in its reactor
        run: |
          set -euo pipefail
          cd debug
          xvfb-run -a mvn -B -ntp -Pbuild-individual-bundles -Dcompare-version-with-baselines.skip=false -DtestClass=org.eclipse.jdt.debug.tests.ui.TemplateRegistryTests -DfailIfNoTests=false -pl org.eclipse.jdt.debug.tests -am install > ../evidence/debug.log 2>&1
          tail -30 ../evidence/debug.log
      - name: Stage the JDT feature matching the staged SDK bundles
        run: |
          set -euo pipefail
          cd jdt-feature
          mvn -B -ntp -Pbuild-individual-bundles -DskipTests -Dcompare-version-with-baselines.skip=false install > ../evidence/jdt-feature.log 2>&1
          tail -30 ../evidence/jdt-feature.log
      - name: Publish a local p2 candidate without relaxing PDE's cache policy
        run: |
          python3 - <<'PY'
          import shutil,zipfile
          from pathlib import Path
          dest=Path('candidate-publisher/target/source')
          (dest/'plugins').mkdir(parents=True)
          (dest/'features').mkdir()
          copied=[]
          for repo in ['jdt-ui','debug','jdt-feature']:
              for jar in Path(repo).glob('*/target/*.jar'):
                  with zipfile.ZipFile(jar) as z:
                      names=z.namelist()
                      if 'feature.xml' in names:
                          folder='features'
                      elif 'META-INF/MANIFEST.MF' in names and b'Bundle-SymbolicName:' in z.read('META-INF/MANIFEST.MF'):
                          folder='plugins'
                      else:
                          continue
                  target=dest/folder/jar.name
                  assert not target.exists(),target
                  shutil.copy2(jar,target)
                  copied.append(str(jar))
          assert any('org.eclipse.jdt.ui-3.40.100' in x for x in copied),copied
          Path('evidence/p2-candidate-inputs.txt').write_text('\n'.join(copied))
          Path('candidate-publisher/pom.xml').write_text('<project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>qa</groupId><artifactId>sdk-candidate</artifactId><version>1</version></project>')
          url=Path('candidate-publisher/target/repository').resolve().as_uri()
          Path('candidate-settings.xml').write_text('<settings><profiles><profile><id>sdk-candidate</id><repositories><repository><id>sdk-candidate</id><layout>p2</layout><url>'+url+'</url></repository></repositories></profile></profiles><activeProfiles><activeProfile>sdk-candidate</activeProfile></activeProfiles></settings>')
          PY
          mvn -f candidate-publisher/pom.xml -B -ntp org.eclipse.tycho.extras:tycho-p2-extras-plugin:5.0.4:publish-features-and-bundles > evidence/publisher.log 2>&1
          test -f candidate-publisher/target/repository/content.jar
          grep -- '-Dtycho.localArtifacts=ignore' pde/.mvn/maven.config
      - name: Build PDE independently against the explicit candidate p2 repository
        run: |
          set -euo pipefail
          cd pde
          xvfb-run -a mvn -s "$GITHUB_WORKSPACE/candidate-settings.xml" -B -ntp -Pbuild-individual-bundles -Dcompare-version-with-baselines.skip=false -DtestClass=org.eclipse.pde.ui.tests.runtime.E4TemplateCompletionTest -DfailIfNoTests=false -pl ui/org.eclipse.pde.ui.tests -am verify > ../evidence/pde.log 2>&1
          tail -30 ../evidence/pde.log
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Require real test results from all three separate builds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,xml.etree.ElementTree as ET
          expected={'org.eclipse.jdt.text.tests.templates.TemplateContributionTest':6,'org.eclipse.jdt.debug.tests.ui.TemplateRegistryTests':3,'org.eclipse.pde.ui.tests.runtime.E4TemplateCompletionTest':2}
          counts={};failures=[]
          for directory in ['jdt-ui','debug','pde']:
              for p in Path(directory).glob('**/target/surefire-reports/TEST-*.xml'):
                  for t in ET.parse(p).getroot().iter('testcase'):
                      c=t.get('classname','')
                      if c not in expected: continue
                      counts[c]=counts.get(c,0)+1
                      for tag in ['failure','error','skipped']:
                          e=t.find(tag)
                          if e is not None: failures.append([c,t.get('name'),tag,e.get('message'),e.text])
          result={'tests':counts,'failures':failures,'mode':'separate Maven invocations; PDE localArtifacts=ignore unchanged; provider and matching feature supplied by explicit candidate p2 repository'}
          Path('evidence/summary.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          assert counts==expected and not failures,result
          PY
      - name: Preserve logs and exact test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-sdk-builds
          include-hidden-files: true
          path: |
            evidence
            candidate-settings.xml
            candidate-publisher/target/repository/content.jar
            **/target/surefire-reports/TEST-*.xml
            **/target/work/data/.metadata/.log
          retention-days: 14
