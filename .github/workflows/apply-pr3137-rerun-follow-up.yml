name: Apply PR 3137 rerun follow-up

on:
  push:
    branches:
      - automation/pr3137-rerun-follow-up

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the temporary branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply the rerun-context fix and regression test
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path_name: str, old: str, new: str, expected: int = 1) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path_name}: expected {expected} occurrence(s), found {count}: {old!r}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="")

          session = "org.eclipse.jdt.junit.core/src/org/eclipse/jdt/internal/junit/model/TestRunSession.java"
          history = "org.eclipse.jdt.junit.core/src/org/eclipse/jdt/internal/junit/model/TestRunSessionHistory.java"
          view = "org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/TestRunnerViewPart.java"
          tests = "org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/TestRunSessionHistoryTests.java"

          replace_exact(
              session,
              "import org.eclipse.debug.core.ILaunchConfiguration;\nimport org.eclipse.debug.core.ILaunchManager;",
              "import org.eclipse.debug.core.ILaunchConfiguration;\nimport org.eclipse.debug.core.ILaunchConfigurationWorkingCopy;\nimport org.eclipse.debug.core.ILaunchManager;",
          )
          replace_exact(
              session,
              "\tpublic boolean canRerun() {\n\t\tILaunchConfiguration configuration= getRerunLaunchConfiguration();\n\t\treturn configuration != null && configuration.exists() && getRerunLaunchMode() != null;\n\t}\n",
              "\tstatic ILaunchConfiguration getPersistedRerunLaunchConfiguration(ILaunchConfiguration configuration) {\n\t\twhile (configuration instanceof ILaunchConfigurationWorkingCopy workingCopy) {\n\t\t\tILaunchConfiguration original= workingCopy.getOriginal();\n\t\t\tif (original == null || original == configuration)\n\t\t\t\tbreak;\n\t\t\tconfiguration= original;\n\t\t}\n\t\treturn configuration;\n\t}\n\n\tpublic boolean canRerun() {\n\t\tILaunchConfiguration configuration=\n\t\t\t\tgetPersistedRerunLaunchConfiguration(getRerunLaunchConfiguration());\n\t\treturn configuration != null && configuration.exists() && getRerunLaunchMode() != null;\n\t}\n",
          )
          replace_exact(
              history,
              "\t\t\tILaunchConfiguration launchConfiguration= session.getRerunLaunchConfiguration();",
              "\t\t\tILaunchConfiguration launchConfiguration= TestRunSession\n\t\t\t\t\t.getPersistedRerunLaunchConfiguration(session.getRerunLaunchConfiguration());",
          )

          replace_exact(
              view,
              "if (launchConfiguration == null || !launchConfiguration.exists() || launchMode == null)",
              "if (launchConfiguration == null || launchMode == null || !fTestRunSession.canRerun())",
              expected=2,
          )
          replace_exact(
              view,
              "\t\t\t\tILaunchConfigurationWorkingCopy tmp= configuration.copy(configName);",
              "\t\t\t\tILaunchConfigurationWorkingCopy tmp= configuration.getWorkingCopy();\n\t\t\t\ttmp.rename(configName);",
          )
          replace_exact(
              view,
              "\t\t\tILaunchConfigurationWorkingCopy tmp= launchConfiguration.copy(configName);",
              "\t\t\tILaunchConfigurationWorkingCopy tmp= launchConfiguration.getWorkingCopy();\n\t\t\ttmp.rename(configName);",
          )
          replace_exact(
              view,
              "\t\t\tif (launchConfiguration != null && launchConfiguration.exists()) {",
              "\t\t\tif (launchConfiguration != null && fTestRunSession.canRerun()) {",
          )
          replace_exact(
              view,
              "\t\t\t\t\tILaunchConfigurationWorkingCopy tmp = launchConfiguration.copy(configName);",
              "\t\t\t\t\tILaunchConfigurationWorkingCopy tmp= launchConfiguration.getWorkingCopy();\n\t\t\t\t\ttmp.rename(configName);",
          )
          replace_exact(
              view,
              "\t\t\tfRerunLastTestAction.setEnabled(true);",
              "\t\t\tupdateRerunActions();",
          )
          replace_exact(
              view,
              "updateRerunFailedFirstAction();",
              "updateRerunActions();",
              expected=3,
          )
          replace_exact(
              view,
              "\n\t\t\tfRerunLastTestAction.setEnabled(fTestRunSession.canRerun());",
              "",
          )
          replace_exact(
              view,
              "\tprivate void updateRerunFailedFirstAction() {\n\t\tboolean state= hasErrorsOrFailures() && fTestRunSession.canRerun();\n\t\tfRerunFailedFirstAction.setEnabled(state);\n\t}\n",
              "\tprivate void updateRerunActions() {\n\t\tboolean canRerun= fTestRunSession != null && fTestRunSession.canRerun();\n\t\tfRerunLastTestAction.setEnabled(canRerun);\n\t\tfRerunFailedFirstAction.setEnabled(canRerun && hasErrorsOrFailures());\n\t}\n",
          )

          test_method = '''\t@Test
\tpublic void restoresRelaunchContextForFailuresFirstWorkingCopy() throws Exception {
\t\tFile historyDirectory= fTemporaryFolder.newFolder("history"); //$NON-NLS-1$
\t\tILaunchConfiguration configuration= createLaunchConfiguration();
\t\ttry {
\t\t\tILaunchConfigurationWorkingCopy failuresFirst= configuration.getWorkingCopy();
\t\t\tfailuresFirst.rename(configuration.getName() + " (failures first)"); //$NON-NLS-1$
\t\t\tfailuresFirst.setAttribute(JUnitLaunchConfigurationConstants.ATTR_FAILURES_NAMES,
\t\t\t\t\t"test-failures.txt"); //$NON-NLS-1$
\t\t\tTestRunSession session= relaunchableSession("failures first", failuresFirst, //$NON-NLS-1$
\t\t\t\t\tILaunchManager.RUN_MODE);

\t\t\tassertFalse(failuresFirst.exists());
\t\t\tassertTrue(session.canRerun());
\t\t\tTestRunSessionHistory.store(List.of(session), historyDirectory, 10);
\t\t\tTestRunSession restored= TestRunSessionHistory.load(historyDirectory, 10).get(0);

\t\t\tassertTrue(restored.canRerun());
\t\t\tassertEquals(configuration.getMemento(), restored.getRerunLaunchConfiguration().getMemento());
\t\t\tassertEquals(ILaunchManager.RUN_MODE, restored.getRerunLaunchMode());
\t\t} finally {
\t\t\tif (configuration.exists())
\t\t\t\tconfiguration.delete();
\t\t}
\t}

'''
          replace_exact(
              tests,
              "\t@Test\n\tpublic void missingLaunchConfigurationDisablesRelaunchWithoutLosingHistory() throws Exception {",
              test_method + "\t@Test\n\tpublic void missingLaunchConfigurationDisablesRelaunchWithoutLosingHistory() throws Exception {",
          )
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 4
          grep -q "getPersistedRerunLaunchConfiguration" org.eclipse.jdt.junit.core/src/org/eclipse/jdt/internal/junit/model/TestRunSession.java
          grep -q "restoresRelaunchContextForFailuresFirstWorkingCopy" org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/TestRunSessionHistoryTests.java

      - name: Run the focused JUnit history test class
        shell: bash
        run: |
          xvfb-run -a ./mvnw -V -B -ntp \
            -pl org.eclipse.jdt.ui.tests -am \
            -Dtest=org.eclipse.jdt.junit.tests.TestRunSessionHistoryTests \
            verify

      - name: Commit the validated source changes
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add \
            org.eclipse.jdt.junit.core/src/org/eclipse/jdt/internal/junit/model/TestRunSession.java \
            org.eclipse.jdt.junit.core/src/org/eclipse/jdt/internal/junit/model/TestRunSessionHistory.java \
            org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/TestRunnerViewPart.java \
            org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/TestRunSessionHistoryTests.java
          git commit -m "Keep JUnit rerun context for transient launches"
          git push origin HEAD:automation/pr3137-rerun-follow-up
