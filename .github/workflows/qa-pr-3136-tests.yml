name: Apply and verify PR 3136 compiler fix

on:
  push:
    branches:
      - qa-pr-3136-tests

permissions:
  contents: write

jobs:
  fix-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: pr-2744-remaining-enumsource
          fetch-depth: 0

      - name: Restore the two required AST result casts
        shell: bash
        run: |
          set -euo pipefail
          file='org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/EnumSourceValidator.java'

          test "$(grep -c 'replacement.setTypeName(ASTNode.copySubtree' "$file")" -eq 1
          test "$(grep -c 'valuePair.setValue(ASTNode.copySubtree' "$file")" -eq 1

          sed -i 's/replacement\.setTypeName(ASTNode\.copySubtree(/replacement.setTypeName((Name) ASTNode.copySubtree(/' "$file"
          sed -i 's/valuePair\.setValue(ASTNode\.copySubtree(/valuePair.setValue((Expression) ASTNode.copySubtree(/' "$file"

          test "$(grep -c 'replacement.setTypeName((Name) ASTNode.copySubtree' "$file")" -eq 1
          test "$(grep -c 'valuePair.setValue((Expression) ASTNode.copySubtree' "$file")" -eq 1
          git diff --check
          git diff -- "$file"

      - name: Compile JUnit bundle with Tycho
        run: >-
          mvn -U -e -DskipTests=true
          clean verify --batch-mode --fail-fast
          -Pbuild-individual-bundles
          -Dcompare-version-with-baselines.skip=true
          -pl org.eclipse.jdt.junit -am

      - name: Commit verified fix to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Carsten Hammer'
          git config user.email '3164220+carstenartur@users.noreply.github.com'
          git add org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/EnumSourceValidator.java
          git commit -m 'Fix AST copy result types in EnumSource validator'
          git push origin HEAD:pr-2744-remaining-enumsource
