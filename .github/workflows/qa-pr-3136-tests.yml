name: QA PR 3136 tests

on:
  push:
    branches:
      - qa-pr-3136-tests

permissions:
  contents: read

jobs:
  junit-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run JDT UI test suite
        run: >-
          xvfb-run --auto-servernum
          mvn -U -e -DskipTests=false
          clean verify --batch-mode --fail-fast
          -Pbuild-individual-bundles
          -Dcompare-version-with-baselines.skip=true
          -pl org.eclipse.jdt.ui.tests -am

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-3136-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/work/data/.metadata/.log
            **/target/compilelogs/**
          if-no-files-found: ignore
