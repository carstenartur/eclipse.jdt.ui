name: EnumSource New and Noteworthy Screenshots

on:
  push:
    branches: [screenshots/junit-enumsource-3136]
    paths:
      - 'org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/EnumSourceNewAndNoteworthyTest.java'
      - '.github/workflows/junit-enumsource-nn.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enumsource-nn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.repository == 'carstenartur/eclipse.jdt.ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install graphical test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox dbus-x11 libgtk-3-0t64 libxtst6 fonts-dejavu-core
      - name: Register fork-only perspective and focused test selection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          bundle = Path('org.eclipse.jdt.ui.tests')
          plugin = bundle / 'plugin.xml'
          text = plugin.read_text()
          assert text.count('</plugin>') == 1
          extension = '''
            <extension point="org.eclipse.ui.perspectives">
              <perspective id="org.eclipse.jdt.ui.tests.enumSourceScreenshot"
                name="EnumSource Code and Results"
                class="org.eclipse.jdt.junit.tests.EnumSourceNewAndNoteworthyTest$CodeAndResultsPerspective"/>
            </extension>
          '''
          plugin.write_text(text.replace('</plugin>', extension + '</plugin>'))
          pom = bundle / 'pom.xml'
          text = pom.read_text()
          includes = '''<includes>
            <include>org/eclipse/jdt/junit/tests/EnumSourceNewAndNoteworthyTest.class</include>
            <include>org/eclipse/jdt/junit/tests/EnumSourceFilterTest.class</include>
            <include>org/eclipse/jdt/junit/tests/EnumSourceSafetyTest.class</include>
          </includes>'''
          assert len(re.findall(r'<includes>.*?</includes>', text, re.S)) == 1
          pom.write_text(re.sub(r'<includes>.*?</includes>', includes, text, count=1, flags=re.S))
          PY
      - name: Run native UI fixture and EnumSource regressions
        env:
          GTK_THEME: Adwaita
          GDK_BACKEND: x11
        run: |
          xvfb-run -a -s '-screen 0 1360x1000x24' dbus-run-session -- bash -eu -o pipefail -c '
            openbox > /tmp/enumsource-openbox.log 2>&1 &
            mvn -B -ntp \
              -Pbuild-individual-bundles \
              -Dcompare-version-with-baselines.skip=true \
              -Dscreenshots.dir="$GITHUB_WORKSPACE/org.eclipse.jdt.ui.tests/target/screenshots" \
              -pl org.eclipse.jdt.ui.tests -am verify
          '
      - name: Require executed tests, screenshots and provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import struct
          import hashlib
          target = Path('org.eclipse.jdt.ui.tests/target')
          suites = [ET.parse(p).getroot() for p in (target / 'surefire-reports').glob('TEST-*.xml')]
          expected = ['EnumSourceNewAndNoteworthyTest', 'EnumSourceFilterTest', 'EnumSourceSafetyTest']
          for name in expected:
              found = [s for s in suites if s.get('name', '').endswith('.' + name)]
              assert len(found) == 1, (name, [s.get('name') for s in suites])
              suite = found[0]
              assert int(suite.get('tests', 0)) > 0, suite.attrib
              assert all(int(suite.get(k, 0)) == 0 for k in ('failures', 'errors', 'skipped')), suite.attrib
              print(suite.attrib)
          folder = target / 'screenshots'
          for name in ['junit-enumsource-exclude.png', 'junit-enumsource-reinclude.png']:
              data = (folder / name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n' and len(data) > 1000
              width, height = struct.unpack('>II', data[16:24])
              assert width <= 790 and height <= 760, (width, height)
              print(name, width, height, hashlib.sha256(data).hexdigest())
          evidence = (folder / 'enumsource-evidence.txt').read_text()
          assert 'after exclusion: total=2, skipped=0' in evidence
          assert 'after re-including GREEN: total=3, skipped=0' in evidence
          assert 'Re-include All Enum Values: total=3, skipped=0' in evidence
          print(evidence)
          PY
          git rev-parse HEAD > org.eclipse.jdt.ui.tests/target/screenshots/capture-source-commit.txt
          printf '%s\n' 7bd8ddf82ff52d17e516cc48b22431dc63449b5f > org.eclipse.jdt.ui.tests/target/screenshots/feature-source-commit.txt
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-enumsource-nn
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
          path: |
            org.eclipse.jdt.ui.tests/target/screenshots/
            org.eclipse.jdt.ui.tests/target/surefire-reports/
            org.eclipse.jdt.ui.tests/target/work/.metadata/.log
