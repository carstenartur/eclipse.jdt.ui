name: PR 3154 full reactor with verified toolchains
on:
  push:
    branches: [diagnostic/pr-3154-session-readiness]
    paths:
      - .github/workflows/pr-3154-session-readiness.yml
      - .github/qa/pr3154_full_qa.py
      - .github/qa/test_pr3154_full_qa.py
      - .github/qa/pr3154_thread_watch.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-3154-full-reactor-jdk25-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full:
    if: github.repository == 'carstenartur/eclipse.jdt.ui'
    name: Full reactor (${{ matrix.variant }})
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [base, candidate]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check evidence validator and preserve it outside the tested checkout
        run: |
          python3 -m unittest discover -s .github/qa -p test_pr3154_full_qa.py -v
          cp .github/qa/pr3154_full_qa.py "$RUNNER_TEMP/full_qa.py"
          cp .github/qa/pr3154_thread_watch.py "$RUNNER_TEMP/thread_watch.py"
          python3 -m py_compile "$RUNNER_TEMP/thread_watch.py"
          if [[ "$VARIANT" == base ]]; then
            source=6312a1cc907ad0a5ac5dd42e998eb0cbac686205
          else
            source=bf24d6056342abb9a574c9f5ec0b9092b2ca238a
          fi
          git checkout --detach "$source"
          test "$(git rev-parse HEAD)" = "$source"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git diff --check
          git diff > evidence/source.diff
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Remember Java 8 home
        run: echo "JDK8=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Remember Java 17 home
        run: echo "JDK17=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Remember target platform Java 25 home
        run: echo "JDK25=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure exact BREE toolchain IDs and verify all reactor requirements
        run: |
          export JDK21="$JAVA_HOME"
          python3 "$RUNNER_TEMP/full_qa.py" toolchains
          # The immutable target declares JavaSE-25. Maven and UI tests still run on 21.
          # Adding this toolchain alone fixes the baseline error in run 34001657927.
          python3 - <<'PYCODE'
          import os, shutil
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path.home() / '.m2/toolchains.xml'
          tree = ET.parse(path)
          entry = ET.SubElement(tree.getroot(), 'toolchain')
          ET.SubElement(entry, 'type').text = 'jdk'
          provides = ET.SubElement(entry, 'provides')
          for name, value in (('id', 'JavaSE-25'), ('version', '25'), ('vendor', 'temurin')):
              ET.SubElement(provides, name).text = value
          ET.SubElement(ET.SubElement(entry, 'configuration'), 'jdkHome').text = os.environ['JDK25']
          ET.indent(tree.getroot())
          tree.write(path, encoding='utf-8', xml_declaration=True)
          shutil.copy2(path, 'evidence/toolchains.xml')
          PYCODE
          java -version 2> evidence/java.txt
          mvn -version > evidence/maven.txt
          cp /etc/os-release evidence/os-release.txt
      - name: Install VNC display and SWT Browser runtime
        run: |
          sudo apt-get update
          # SWT's Ubuntu Browser prerequisite; both sources failed without it in run 34001899772.
          sudo apt-get install -y tigervnc-standalone-server x11-utils libgtk-3-0 libasound2 libwebkit2gtk-4.0-37
          dpkg-query -W libwebkit2gtk-4.0-37 libgtk-3-0 > evidence/native-packages.txt
          python3 -c "import ctypes; ctypes.CDLL('libwebkit2gtk-4.0.so.37'); print('WebKitGTK native library loaded successfully')" | tee evidence/webkit-preflight.txt
      - name: Full Jenkins command with baseline checking enabled and thread diagnostics
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          mkdir -p evidence/upstream evidence/threads
          Xvnc "$DISPLAY" -geometry 1280x1024 -depth 24 -SecurityTypes None -localhost -nolisten tcp -ac > evidence/vnc.log 2>&1 &
          vnc_pid=$!
          watcher_pid=''
          cleanup() {
            touch "$RUNNER_TEMP/stop-thread-watch"
            if [[ -n "$watcher_pid" ]]; then wait "$watcher_pid" || true; fi
            kill "$vnc_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 50); do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then break; fi
            kill -0 "$vnc_pid"
            sleep 0.2
          done
          xdpyinfo -display "$DISPLAY" > evidence/display.txt
          rm -f "$RUNNER_TEMP/stop-thread-watch"
          python3 "$RUNNER_TEMP/thread_watch.py" --workspace "$PWD" --output "$PWD/evidence/threads" \
            --stop-file "$RUNNER_TEMP/stop-thread-watch" --jcmd "$JAVA_HOME/bin/jcmd" \
            > evidence/thread-watch.log 2>&1 &
          watcher_pid=$!
          command=(mvn -U -e -ntp -DskipTests=false -Dmaven.repo.local="$RUNNER_TEMP/m2-full"
            clean verify --batch-mode --fail-at-end
            -Pbree-libs -Papi-check -Pjavadoc -Pbuild-individual-bundles
            -Dmaven.test.failure.ignore=true -Dcompare-version-with-baselines.skip=false)
          printf '%q ' "${command[@]}" > evidence/upstream/command.txt
          printf '\n' >> evidence/upstream/command.txt
          set +e
          "${command[@]}" 2>&1 | tee evidence/upstream/maven.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > evidence/upstream/maven-exit.txt
          python3 "$RUNNER_TEMP/full_qa.py" capture --variant "$VARIANT" --phase upstream --exit-code "$result"
          mkdir -p evidence/resolved-inputs
          find "$RUNNER_TEMP/m2-full/org/eclipse" -maxdepth 3 -type f \
            \( -name 'eclipse-platform-parent-*.pom' -o -name 'eclipse-sdk-prereqs-*.target' \) \
            -exec cp -t evidence/resolved-inputs {} +
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Enforce actual complete test inventory, Maven result and failures
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          result = json.loads(Path('evidence/upstream/summary.json').read_text())
          assert result['passed'], 'The upstream command and complete test inventory must both pass. Inspect XML, Maven log and thread dumps.'
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-3154-jdk25-full-${{ matrix.variant }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            evidence/
            **/target/surefire-reports/**
            **/target/work/data/.metadata/*.log
