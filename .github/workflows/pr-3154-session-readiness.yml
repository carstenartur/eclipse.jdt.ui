name: PR 3154 full reactor and upstream evidence
on:
  push:
    branches: [diagnostic/pr-3154-session-readiness]
    paths:
      - .github/workflows/pr-3154-session-readiness.yml
      - .github/qa/pr3154_full_qa.py
      - .github/qa/test_pr3154_full_qa.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-3154-full-reactor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  upstream-evidence:
    if: github.repository == 'carstenartur/eclipse.jdt.ui'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read public Jenkins build metadata, test reports and consoles
        run: python3 .github/qa/pr3154_full_qa.py jenkins
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-3154-public-jenkins-evidence
          path: evidence/
          if-no-files-found: error
  full:
    if: github.repository == 'carstenartur/eclipse.jdt.ui'
    name: Full reactor (${{ matrix.variant }})
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        variant: [base, candidate]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check evidence validator and preserve it outside the tested checkout
        run: |
          python3 -m unittest discover -s .github/qa -p test_pr3154_full_qa.py -v
          cp .github/qa/pr3154_full_qa.py "$RUNNER_TEMP/full_qa.py"
          if [[ "$VARIANT" == base ]]; then
            source=6312a1cc907ad0a5ac5dd42e998eb0cbac686205
          else
            source=bf24d6056342abb9a574c9f5ec0b9092b2ca238a
          fi
          git checkout --detach "$source"
          test "$(git rev-parse HEAD)" = "$source"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git diff --check
          git diff > evidence/source.diff
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Remember Java 8 home
        run: echo "JDK8=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Remember Java 17 home
        run: echo "JDK17=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure exact BREE toolchain IDs and verify all reactor requirements
        run: |
          export JDK21="$JAVA_HOME"
          python3 "$RUNNER_TEMP/full_qa.py" toolchains
          java -version 2> evidence/java.txt
          mvn -version > evidence/maven.txt
          cp /etc/os-release evidence/os-release.txt
      - name: Install VNC display
        run: |
          sudo apt-get update
          sudo apt-get install -y tigervnc-standalone-server x11-utils libgtk-3-0 libasound2
      - name: Full Jenkins command, with separately labelled test-only fallback
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvnc "$DISPLAY" -geometry 1280x1024 -depth 24 -SecurityTypes None -localhost -nolisten tcp -ac > evidence/vnc.log 2>&1 &
          vnc_pid=$!
          trap 'kill "$vnc_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then break; fi
            kill -0 "$vnc_pid"
            sleep 0.2
          done
          xdpyinfo -display "$DISPLAY" > evidence/display.txt
          run_phase() {
            phase=$1
            baseline_skip=$2
            mkdir -p "evidence/$phase"
            command=(mvn -U -e -ntp -DskipTests=false -Dmaven.repo.local="$RUNNER_TEMP/m2-full"
              clean verify --batch-mode --fail-at-end
              -Pbree-libs -Papi-check -Pjavadoc -Pbuild-individual-bundles
              -Dmaven.test.failure.ignore=true -Dcompare-version-with-baselines.skip="$baseline_skip")
            printf '%q ' "${command[@]}" > "evidence/$phase/command.txt"
            printf '\n' >> "evidence/$phase/command.txt"
            set +e
            "${command[@]}" 2>&1 | tee "evidence/$phase/maven.log"
            result=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$result" > "evidence/$phase/maven-exit.txt"
            python3 "$RUNNER_TEMP/full_qa.py" capture --variant "$VARIANT" --phase "$phase" --exit-code "$result"
          }
          run_phase upstream false
          if grep -Fq 'Cannot set full specification for a custom profile more than once' evidence/upstream/maven.log; then
            printf '%s\n' 'The upstream phase failed in the baseline comparator. A clean full test run follows with ONLY this comparison disabled. It is NOT an upstream CI pass.' | tee evidence/tests-only-reason.txt
            run_phase tests-only true
          fi
          mkdir -p evidence/resolved-inputs
          find "$RUNNER_TEMP/m2-full/org/eclipse" -maxdepth 3 -type f \
            \( -name 'eclipse-platform-parent-*.pom' -o -name 'eclipse-sdk-prereqs-*.target' \) \
            -exec cp -t evidence/resolved-inputs {} +
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Enforce actual complete test inventory and failures
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = Path('evidence/tests-only/summary.json')
          if not report.exists():
              report = Path('evidence/upstream/summary.json')
          result = json.loads(report.read_text())
          assert result['passed'], f'Full tests did not pass; inspect {report}'
          PY
      - name: Keep upstream-command failures visible even if the fallback tests pass
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('evidence/upstream/summary.json').read_text())
          assert result['passed'], 'The exact upstream command did not pass. A tests-only pass does not override this failure.'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-3154-toolchains-full-${{ matrix.variant }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            evidence/
            **/target/surefire-reports/**
            **/target/work/data/.metadata/*.log
