name: Expanded isolated PR QA
on:
  push:
    branches: [ci/3152-3154-isolated-qa]
    paths: [.github/workflows/expanded-pr-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        mode: [junit, occurrence]
    env:
      MODE: ${{ matrix.mode }}
      BASE: 6312a1cc907ad0a5ac5dd42e998eb0cbac686205
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare minimal test hardening on the independent PR head
        run: |
          cp .github/qa/harden_tests.py /tmp/harden_tests.py
          if [[ "$MODE" == junit ]]; then
            git checkout --detach b52d3f8e49df81d7d0c205fc539c508ce603488b
          else
            git checkout --detach af8e9e9bd1162a87538a9fd7e6ea2d85a808de6c
          fi
          python3 /tmp/harden_tests.py "$MODE"
          mkdir -p evidence
          git diff --check
          git diff > evidence/proposed-test-hardening.diff
          git rev-parse HEAD > evidence/head.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libasound2
      - name: Full suite, focused repeat and negative control
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" == junit ]]; then
            module=org.eclipse.jdt.ui.tests
            focused=TestRunListenerTest5,TestRunListenerTest6
            product=org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/TestRunnerViewPart.java
          else
            module=org.eclipse.jdt.text.tests
            focused=MarkOccurrenceTest
            product=org.eclipse.jdt.ui/ui/org/eclipse/jdt/internal/ui/javaeditor/JavaEditor.java
          fi
          for phase in positive-suite positive-repeat negative; do
            export PHASE="$phase"
            tests="$focused"
            if [[ "$MODE" == junit && "$phase" == positive-suite ]]; then tests=JUnitJUnitTests; fi
            if [[ "$phase" == negative ]]; then git show "$BASE:$product" > "$product"; fi
            mkdir -p "evidence/$phase"
            set +e
            xvfb-run -a mvn -B -ntp clean verify -Pbuild-individual-bundles -pl "$module" -am -DskipTests=false -Dmaven.test.skip=false -Dtest="$tests" -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee "evidence/$phase/maven.log"
            export MAVEN_RESULT=${PIPESTATUS[0]}
            set -e
            if [[ -d "$module/target/surefire-reports" ]]; then cp -r "$module/target/surefire-reports" "evidence/$phase/reports"; fi
            if [[ -f "$module/target/work/data/.metadata/.log" ]]; then cp "$module/target/work/data/.metadata/.log" "evidence/$phase/eclipse.log"; fi
            git restore --source=HEAD -- "$product"
            python3 - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('evidence') / os.environ['PHASE']
          mode = os.environ['MODE']
          phase = os.environ['PHASE']
          cases = {}
          for report in root.rglob('TEST-*.xml'):
              for case in ET.parse(report).getroot().iter('testcase'):
                  key = (case.get('classname'), case.get('name'))
                  assert key not in cases, f'Duplicate test case: {key}'
                  cases[key] = case
          if mode == 'junit':
              cls = 'org.eclipse.jdt.junit.tests.TestRunListenerTest5'
              names = ['testRetiredSessionTerminationDoesNotStopActiveSession', 'testRetiredSessionStopDoesNotStopActiveSession', 'testRetiredSessionEndDoesNotStopActiveSession']
              required = {(cls, name) for name in names + ['testActiveSessionTerminationStopsUpdateJobs', 'testActiveSessionStopStopsUpdateJobs', 'testActiveSessionEndStopsUpdateJobs', 'testTerminateLaunch']}
              required.add(('org.eclipse.jdt.junit.tests.TestRunListenerTest6', 'testTerminateLaunch'))
              if phase == 'positive-suite':
                  assert len(cases) >= 100, f'Full JUnit suite not executed: {len(cases)}'
                  for suffix in ['TestRunListenerTest3', 'TestRunListenerTest4', 'TestRunSessionHistoryTests', 'TestRunSessionSerializationTests3', 'TestRunSessionSerializationTests4', 'TestSorting']:
                      assert any(key[0].endswith('.' + suffix) for key in cases), f'Missing suite component: {suffix}'
              else:
                  assert len(cases) == 22, len(cases)
          else:
              cls = 'org.eclipse.jdt.text.tests.MarkOccurrenceTest'
              names = ['markOccurrencesAfterCanceledUpdate', 'markOccurrencesAfterCanceledUpdateWithExistingAnnotations', 'markOccurrencesAfterConcurrentRemoval', 'markOccurrencesAfterConcurrentRemovalWithExistingAnnotations']
              required = {(cls, name) for name in names + ['markOccurrencesAfterEditorReuse']}
              assert len(cases) == 15, len(cases)
          assert required.issubset(cases), f'Missing tests: {required - cases.keys()}'
          failed = {key for key, case in cases.items() if case.find('failure') is not None or case.find('error') is not None}
          skipped = {key for key, case in cases.items() if case.find('skipped') is not None}
          assert not (required & skipped), f'Required tests skipped: {required & skipped}'
          expected = {(cls, name) for name in names} if phase == 'negative' else set()
          summary = {'mode': mode, 'phase': phase, 'tests': len(cases), 'failures': sorted(failed), 'skipped': sorted(skipped), 'maven_result': int(os.environ['MAVEN_RESULT'])}
          (root / 'summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          assert failed == expected, f'Expected {expected}, observed {failed}'
          assert (int(os.environ['MAVEN_RESULT']) == 0) == (not expected), 'Unexpected Maven result'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out: out.write(f'{mode} {phase}: {len(cases)} tests, {len(failed)} expected failures, {len(skipped)} skips; verified.\n')
          PY
          done
      - name: Stage the tested file as an unreferenced Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          if os.environ['MODE'] == 'junit':
              path = 'org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/TestRunListenerTest5.java'
          else:
              path = 'org.eclipse.jdt.text.tests/src/org/eclipse/jdt/text/tests/MarkOccurrenceTest.java'
          assert git('diff', '--name-only') == path, 'Only the intended test file may differ'
          subprocess.run(['git', 'diff', '--check'], check=True)
          text = pathlib.Path(path).read_text()
          request = urllib.request.Request(os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs', data=json.dumps({'content': text, 'encoding': 'utf-8'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response: blob = json.load(response)
          assert blob['sha'] == git('hash-object', path), 'Staged blob differs from the tested file'
          metadata = {'parent': git('rev-parse', 'HEAD'), 'path': path, 'blob_sha': blob['sha'], 'previous_blob_sha': git('rev-parse', 'HEAD:' + path)}
          pathlib.Path('evidence/tested-blob.json').write_text(json.dumps(metadata, indent=2))
          pathlib.Path('evidence/' + pathlib.Path(path).name).write_text(text)
          print(json.dumps(metadata, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expanded-${{ matrix.mode }}
          if-no-files-found: error
          path: evidence/
