name: Validate issue 2394 targeted

on:
  push:
    branches:
      - validation/issue-2394-targeted

permissions:
  contents: read

jobs:
  targeted-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java toolchains
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            11
            17
            21
          mvn-toolchain-id: |
            JavaSE-1.8
            JavaSE-11
            JavaSE-17
            JavaSE-21
          distribution: temurin
          cache: maven
      - name: Set up Maven
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0
        with:
          maven-version: 3.9.16
      - name: Run JUnit history regression tests
        run: >-
          xvfb-run
          mvn -U -e --batch-mode --fail-at-end
          -Pbuild-individual-bundles
          -Dcompare-version-with-baselines.skip=true
          -DskipTests=false
          -Dtest=org.eclipse.jdt.junit.tests.TestRunSessionHistoryTests
          -pl org.eclipse.jdt.ui.tests -am
          clean verify
