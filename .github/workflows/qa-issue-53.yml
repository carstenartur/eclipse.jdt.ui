          \t\tassertIgnoredParameterizedMethod(session);
          \t\tassertSerializationRoundTrip(session);
          \t}

          \tprivate static void assertIgnoredParameterizedMethod(TestRunSession session) {
          \t\tassertEquals(1, session.getTotalCount());
          \t\tassertEquals(1, session.getStartedCount());
          \t\tassertEquals(1, session.getIgnoredCount());

