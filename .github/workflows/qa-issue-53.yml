name: Apply and verify issue 53 fix

on:
  push:
    branches:
      - qa-fix-53-disabled-parameterized-test

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
