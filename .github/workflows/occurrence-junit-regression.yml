name: Combined occurrence and JUnit regression

on:
  push:
    branches: [ci/3152-junit-session-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [regression-tests, original-launch-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libasound2
      - name: Restore original launch tests for independent verification
        if: matrix.mode == 'original-launch-tests'
        run: |
          git show af8e9e9bd1162a87538a9fd7e6ea2d85a808de6c:org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/TestRunListenerTest5.java > org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/TestRunListenerTest5.java
      - name: Repeat real Eclipse tests and verify execution
        env:
          MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          if [[ "$MODE" == regression-tests ]]; then
            projects=org.eclipse.jdt.ui.tests,org.eclipse.jdt.text.tests
            tests=TestRunListenerTest5,TestRunListenerTest6,MarkOccurrenceTest
          else
            projects=org.eclipse.jdt.ui.tests
            tests=TestRunListenerTest5,TestRunListenerTest6
          fi
          for repetition in 1 2 3; do
            export REPETITION="$repetition"
            mkdir -p "validation/run-$repetition"
            rm -rf org.eclipse.jdt.ui.tests/target/surefire-reports org.eclipse.jdt.text.tests/target/surefire-reports
            set +e
            xvfb-run -a mvn -B -ntp verify -Pbuild-individual-bundles -pl "$projects" -am -DskipTests=false -Dmaven.test.skip=false -Dtest="$tests" -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee "validation/run-$repetition/maven.log"
            result=${PIPESTATUS[0]}
            set -e
            for module in org.eclipse.jdt.ui.tests org.eclipse.jdt.text.tests; do
              if [[ -d "$module/target/surefire-reports" ]]; then
                cp -r "$module/target/surefire-reports" "validation/run-$repetition/$module"
              fi
            done
            python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path('validation') / ('run-' + os.environ['REPETITION'])
          cases = {}
          for report in root.rglob('TEST-*.xml'):
              for case in ET.parse(report).getroot().iter('testcase'):
                  cases[(case.get('classname'), case.get('name'))] = case
          required = {('org.eclipse.jdt.junit.tests.TestRunListenerTest5', 'testTerminateLaunch'), ('org.eclipse.jdt.junit.tests.TestRunListenerTest6', 'testTerminateLaunch')}
          regression_names = ['testRetiredSessionTerminationDoesNotStopActiveSession', 'testRetiredSessionStopDoesNotStopActiveSession', 'testRetiredSessionEndDoesNotStopActiveSession', 'testActiveSessionTerminationStopsUpdateJobs']
          if os.environ['MODE'] == 'regression-tests':
              required.update(('org.eclipse.jdt.junit.tests.TestRunListenerTest5', name) for name in regression_names)
              required.update(('org.eclipse.jdt.text.tests.MarkOccurrenceTest', name) for name in ['markOccurrencesAfterEditorReuse', 'markOccurrencesAfterCanceledUpdate', 'markOccurrencesAfterCanceledUpdateWithExistingAnnotations', 'markOccurrencesAfterConcurrentRemoval', 'markOccurrencesAfterConcurrentRemovalWithExistingAnnotations'])
          else:
              assert not any(name in regression_names for cls, name in cases), 'Original-test control still contains new tests'
              assert len(cases) == 16, f'Expected 16 original launch tests, got {len(cases)}'
          assert required.issubset(cases), f'Missing tests: {required - cases.keys()}'
          for key, case in cases.items():
              assert all(case.find(tag) is None for tag in ['failure', 'error', 'skipped']), f'Test did not pass: {key}'
          summary = f"{os.environ['MODE']}, repetition {os.environ['REPETITION']}: {len(cases)} tests passed, no skips."
          print(summary)
          (root / 'summary.txt').write_text(summary + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary + '\n')
          PY
            if [[ "$result" != 0 ]]; then exit "$result"; fi
          done
      - name: Preserve test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-${{ matrix.mode }}
          if-no-files-found: error
          path: validation/
