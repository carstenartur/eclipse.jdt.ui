name: PR 3163 Jenkins repro

on:
  push:
    branches:
      - debug/pr3163-jenkins

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set up Maven
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1
        with:
          maven-version: 3.9.9
      - name: Verify like Eclipse Jenkins
        run: |
          xvfb-run -a mvn -U -e -DskipTests=false \
            clean verify --batch-mode --fail-at-end \
            -Pbree-libs -Papi-check -Pjavadoc -Pbuild-individual-bundles \
            -Dmaven.test.failure.ignore=true \
            -Dcompare-version-with-baselines.skip=false
