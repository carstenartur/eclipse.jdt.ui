name: Template PR quickfix upstream control
on:
  push:
    branches: [qa/template-sdk-integration-20260922]
    paths: [.github/workflows/template-quickfix-control.yml]
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ref: [643f7a065288d63b2b4b0e6b72d87c31a5ef88fe, 660e48c54e9035cb386743bd1bbbbd645c6bfc1a]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: quickfix-template-${{ matrix.ref }}
          restore-keys: sdk-template-Linux-
      - name: Execute the unchanged package quickfix tests
        shell: bash
        env:
          MAVEN_OPTS: -Xmx4g
        run: |
          set +e
          xvfb-run -a mvn -B -ntp -Pbuild-individual-bundles -DskipTests=false -Dtest=ReorgQuickFixTest -DfailIfNoTests=false -pl org.eclipse.jdt.ui.tests -am verify > "$RUNNER_TEMP/quickfix-control.log" 2>&1
          echo $? > "$RUNNER_TEMP/build-exit.txt"
          tail -60 "$RUNNER_TEMP/quickfix-control.log"
      - name: Record exact failure without weakening the test
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          count=0;bad=[]
          for p in pathlib.Path('.').glob('**/target/surefire-reports/TEST-*.xml'):
            for t in ET.parse(p).getroot().iter('testcase'):
              if t.get('classname')!='org.eclipse.jdt.ui.tests.quickfix.ReorgQuickFixTest':continue
              count+=1
              for tag in ['failure','error']:
                e=t.find(tag)
                if e is not None:bad.append((t.get('name'),e.get('message'),e.text))
          pathlib.Path('quickfix-summary.txt').write_text(str({'tests':count,'failures':bad}))
          print({'tests':count,'failures':bad})
          assert count>0,'No tests executed'
          assert len(bad)==1 and bad[0][0]=='testWrongPackageStatementImplicitClass',bad
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quickfix-control-${{ matrix.ref }}
          path: |
            ${{ runner.temp }}/quickfix-control.log
            ${{ runner.temp }}/build-exit.txt
            quickfix-summary.txt
            **/target/surefire-reports/TEST-*.xml
          retention-days: 14
