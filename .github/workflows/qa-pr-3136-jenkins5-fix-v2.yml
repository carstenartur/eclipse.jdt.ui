name: QA PR 3136 Jenkins fixes

on:
  push:
    branches: ["qa-pr-3136-jenkins5-fix"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa-pr-3136-jenkins5-fix
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old!r}")
              path.write_text(source.replace(old, new), encoding="utf-8")

          finder = Path("org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/TestMethodFinder.java")
          replace_once(finder, "String binaryType= JavaModelUtil.getResolvedTypeName(erasedType, declaringType, '$');", "String binaryType= getResolvedParameterTypeName(erasedType, declaringType, '$');")
          replace_once(finder, "String sourceType= JavaModelUtil.getResolvedTypeName(erasedType, declaringType, '.');", "String sourceType= getResolvedParameterTypeName(erasedType, declaringType, '.');")
          marker = "\tprivate static String normalizeParameterType(String parameterType) {\n"
          helper = "\tprivate static String getResolvedParameterTypeName(String typeSignature, IType declaringType,\n\t\t\tchar enclosingTypeSeparator) throws JavaModelException {\n\t\tint dimensions= Signature.getArrayCount(typeSignature);\n\t\tString elementType= Signature.getElementType(typeSignature);\n\t\tString resolvedType;\n\t\tif (Signature.getTypeSignatureKind(elementType) == Signature.BASE_TYPE_SIGNATURE) {\n\t\t\tresolvedType= Signature.toString(elementType);\n\t\t} else {\n\t\t\tresolvedType= JavaModelUtil.getResolvedTypeName(\n\t\t\t\t\telementType, declaringType, enclosingTypeSeparator);\n\t\t}\n\t\tif (resolvedType == null) {\n\t\t\treturn null;\n\t\t}\n\n\t\tStringBuilder result= new StringBuilder(resolvedType);\n\t\tfor (int i= 0; i < dimensions; i++) {\n\t\t\tresult.append(\"[]\"); //$NON-NLS-1$\n\t\t}\n\t\treturn result.toString();\n\t}\n\n"
          replace_once(finder, marker, helper + marker)

          safety = Path("org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/EnumSourceSafetyTest.java")
          replace_once(safety, "\t\t\t\timport java.time.DayOfWeek;\n\n", "")
          replace_once(safety, "@EnumSource(DayOfWeek.class)", "@EnumSource(EnumSource.Mode.class)")
          replace_once(safety, "public void testWithEnum(DayOfWeek day)", "public void testWithEnum(EnumSource.Mode mode)")
          replace_once(safety, "\t\tIMethod method= getMethod(cu, \"testWithEnum\", \"QDayOfWeek;\"); //$NON-NLS-1$ //$NON-NLS-2$\n", "\t\tIMethod method= Arrays.stream(cu.getType(\"MyTest\").getMethods()) //$NON-NLS-1$\n\t\t\t\t.filter(candidate -> \"testWithEnum\".equals(candidate.getElementName())) //$NON-NLS-1$\n\t\t\t\t.findFirst()\n\t\t\t\t.orElseThrow(AssertionError::new);\n")
          replace_once(safety, "assertEquals(\"MONDAY\", EnumSourceValidator.getEnumConstantForInvocation(method, 1));", "assertEquals(\"INCLUDE\", EnumSourceValidator.getEnumConstantForInvocation(method, 1));")
          replace_once(safety, "assertEquals(\"SUNDAY\", EnumSourceValidator.getEnumConstantForInvocation(method, 7));", "assertEquals(\"EXCLUDE\", EnumSourceValidator.getEnumConstantForInvocation(method, 2));")
          replace_once(safety, "assertNull(EnumSourceValidator.getEnumConstantForInvocation(method, 8));", "assertNull(EnumSourceValidator.getEnumConstantForInvocation(method, 6));")
          PY
          git diff --check

      - name: Build affected reactor
        run: >-
          mvn -B -ntp -U
          -Pbuild-individual-bundles
          -DskipTests=true
          -Dcompare-version-with-baselines.skip=true
          -pl org.eclipse.jdt.ui.tests
          -am install

      - name: Run EnumSource regression tests
        run: >-
          xvfb-run --auto-servernum
          mvn -B -ntp
          -Pbuild-individual-bundles
          -Dcompare-version-with-baselines.skip=true
          -pl org.eclipse.jdt.ui.tests
          -Dtest=org.eclipse.jdt.junit.tests.EnumSourceSafetyTest,org.eclipse.jdt.junit.tests.EnumSourceFilterTest
          test

      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/qa-pr-3136-jenkins5-fix-v2.yml
          git diff --check
          git config user.name "Carsten Hammer"
          git config user.email "carsten.hammer@t-online.de"
          git add \
            org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/TestMethodFinder.java \
            org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/EnumSourceSafetyTest.java \
            .github/workflows/qa-pr-3136-jenkins5-fix-v2.yml
          git commit -m "Fix EnumSource binary and array resolution tests"
          git push origin HEAD:qa-pr-3136-jenkins5-fix
