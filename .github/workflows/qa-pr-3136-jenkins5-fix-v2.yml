name: QA PR 3136 Jenkins fixes

on:
  push:
    branches: ["qa-pr-3136-jenkins5-fix"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa-pr-3136-jenkins5-fix
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply fixes
        shell: bash
        run: |
          cat > /tmp/pr3136.patch <<'PATCH'
          diff --git a/org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/TestMethodFinder.java b/org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/TestMethodFinder.java
          --- a/org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/TestMethodFinder.java
          +++ b/org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/TestMethodFinder.java
          @@ -105,13 +105,13 @@ public final class TestMethodFinder {
          
           			String erasedType= Signature.getTypeErasure(parameterTypes[i]);
          -			String binaryType= JavaModelUtil.getResolvedTypeName(erasedType, declaringType, '$');
          +			String binaryType= getResolvedParameterTypeName(erasedType, declaringType, '$');
           			if (expectedType.equals(binaryType)) {
           				continue;
           			}
          
          -			String sourceType= JavaModelUtil.getResolvedTypeName(erasedType, declaringType, '.');
          +			String sourceType= getResolvedParameterTypeName(erasedType, declaringType, '.');
           			if (!expectedType.equals(sourceType)) {
           				return false;
           			}
          @@ -119,6 +119,31 @@ public final class TestMethodFinder {
           		return true;
           	}
          
          +	private static String getResolvedParameterTypeName(String typeSignature, IType declaringType,
          +			char enclosingTypeSeparator) throws JavaModelException {
          +		int dimensions= Signature.getArrayCount(typeSignature);
          +		String elementType= Signature.getElementType(typeSignature);
          +		String resolvedType;
          +		if (Signature.getTypeSignatureKind(elementType) == Signature.BASE_TYPE_SIGNATURE) {
          +			resolvedType= Signature.toString(elementType);
          +		} else {
          +			resolvedType= JavaModelUtil.getResolvedTypeName(
          +					elementType, declaringType, enclosingTypeSeparator);
          +		}
          +		if (resolvedType == null) {
          +			return null;
          +		}
          +
          +		StringBuilder result= new StringBuilder(resolvedType);
          +		for (int i= 0; i < dimensions; i++) {
          +			result.append("[]"); //$NON-NLS-1$
          +		}
          +		return result.toString();
          +	}
          +
           	private static String normalizeParameterType(String parameterType) {
           		if (parameterType == null) {
           			return null;
          diff --git a/org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/EnumSourceSafetyTest.java b/org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/EnumSourceSafetyTest.java
          --- a/org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/EnumSourceSafetyTest.java
          +++ b/org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/EnumSourceSafetyTest.java
          @@ -116,25 +116,27 @@ public class EnumSourceSafetyTest {
           		ICompilationUnit cu= createCompilationUnit("test1", "MyTest.java", """
           				package test1;
          
          -				import java.time.DayOfWeek;
          -
           				import org.junit.jupiter.params.ParameterizedTest;
           				import org.junit.jupiter.params.provider.EnumSource;
          
           				public class MyTest {
           				    @ParameterizedTest
          -				    @EnumSource(DayOfWeek.class)
          -				    public void testWithEnum(DayOfWeek day) {
          +				    @EnumSource(EnumSource.Mode.class)
          +				    public void testWithEnum(EnumSource.Mode mode) {
           				    }
           				}
           				""");
          -		IMethod method= getMethod(cu, "testWithEnum", "QDayOfWeek;"); //$NON-NLS-1$ //$NON-NLS-2$
          +		IMethod method= Arrays.stream(cu.getType("MyTest").getMethods()) //$NON-NLS-1$
          +				.filter(candidate -> "testWithEnum".equals(candidate.getElementName())) //$NON-NLS-1$
          +				.findFirst()
          +				.orElseThrow(AssertionError::new);
          
          -		assertEquals("MONDAY", EnumSourceValidator.getEnumConstantForInvocation(method, 1)); //$NON-NLS-1$
          -		assertEquals("SUNDAY", EnumSourceValidator.getEnumConstantForInvocation(method, 7)); //$NON-NLS-1$
          -		assertNull(EnumSourceValidator.getEnumConstantForInvocation(method, 8));
          +		assertEquals("INCLUDE", EnumSourceValidator.getEnumConstantForInvocation(method, 1)); //$NON-NLS-1$
          +		assertEquals("EXCLUDE", EnumSourceValidator.getEnumConstantForInvocation(method, 2)); //$NON-NLS-1$
          +		assertNull(EnumSourceValidator.getEnumConstantForInvocation(method, 6));
           		assertCompiles(cu);
           	}
          PATCH
          git apply --check /tmp/pr3136.patch
          git apply /tmp/pr3136.patch
          git diff --check

      - name: Build affected reactor
        run: >-
          mvn -B -ntp -U
          -Pbuild-individual-bundles
          -DskipTests=true
          -Dcompare-version-with-baselines.skip=true
          -pl org.eclipse.jdt.ui.tests
          -am install

      - name: Run EnumSource regression tests
        run: >-
          xvfb-run --auto-servernum
          mvn -B -ntp
          -Pbuild-individual-bundles
          -Dcompare-version-with-baselines.skip=true
          -pl org.eclipse.jdt.ui.tests
          -Dtest=org.eclipse.jdt.junit.tests.EnumSourceSafetyTest,org.eclipse.jdt.junit.tests.EnumSourceFilterTest
          test

      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/qa-pr-3136-jenkins5-fix-v2.yml
          git diff --check
          git config user.name "Carsten Hammer"
          git config user.email "carsten.hammer@t-online.de"
          git add \
            org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/TestMethodFinder.java \
            org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/EnumSourceSafetyTest.java \
            .github/workflows/qa-pr-3136-jenkins5-fix-v2.yml
          git commit -m "Fix EnumSource binary and array resolution tests"
          git push origin HEAD:qa-pr-3136-jenkins5-fix
