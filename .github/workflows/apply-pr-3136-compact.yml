name: Apply compact PR 3136 QA fixes

on:
  push:
    branches:
      - qa-pr-3136-compact-apply

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: qa-pr-3136-compact-apply
          fetch-depth: 0

      - name: Apply compact reviewed implementation
        run: python .github/qa/apply_pr_3136_compact.py

      - name: Remove one-shot migration files
        run: |
          rm .github/qa/apply_pr_3136_compact.py
          rm .github/workflows/apply-pr-3136-compact.yml

      - name: Verify and commit
        run: |
          git status --short
          git diff --stat
          git diff --check
          git config user.name "Carsten Hammer"
          git config user.email "3164220+carstenartur@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Compact and harden EnumSource filtering" -m "Fix the ECJ compilation failure, preserve annotation semantics and imports, and retain focused executable regression coverage." -m "Assisted-by: GitHub Copilot" -m "Assisted-by: OpenAI ChatGPT"
          git push origin HEAD:qa-pr-3136-compact-apply
