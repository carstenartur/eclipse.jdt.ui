name: Verify startup editor integration

on:
  push:
    branches:
      - verify/startup-1860-integration

permissions:
  contents: read

concurrency:
  group: verify-startup-1860-integration
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prepare integration regression
        run: |
          cp .github/apply-startup-fix.py /tmp/apply-startup-fix.py
          cp .github/*Startup*.java /tmp/
          git fetch --depth=1 origin 7ae190d97dcc2cbaec8d54d01d18a4b8a7b38f65
          git checkout --detach 7ae190d97dcc2cbaec8d54d01d18a4b8a7b38f65
          python /tmp/apply-startup-fix.py
          cp /tmp/*Startup*.java org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/ui/tests/packageview/
          python - <<'PY'
          from pathlib import Path
          p = Path('org.eclipse.jdt.ui.tests/plugin.xml')
          s = p.read_text()
          assert s.count('</plugin>') == 1
          p.write_text(s.replace('</plugin>', '<extension point="org.eclipse.jdt.core.classpathContainerInitializer"><classpathContainerInitializer id="org.eclipse.jdt.ui.tests.startupContainer" class="org.eclipse.jdt.ui.tests.packageview.StartupClasspathContainerInitializer"/></extension>\n</plugin>'))
          PY
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Exercise cold editor creation
        run: |
          set -o pipefail
          xvfb-run -a mvn -B -U -e verify -Pbuild-individual-bundles \
            -pl org.eclipse.jdt.ui.tests -am \
            -Dtest=BreadcrumbStartupTests \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false \
            -Dcompare-version-with-baselines.skip=true \
            -DskipTests=false | tee startup-verification.log
      - name: Collect reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-integration-reports
          path: |
            startup-verification.log
            **/target/surefire-reports/**
            **/target/work/data/.metadata/*.log
          if-no-files-found: warn
          retention-days: 7
