name: Diagnose upstream bytecode-view smoke test

on:
  push:
    branches:
      - verify/startup-1860

permissions:
  contents: read

concurrency:
  group: verify-startup-1860
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check out unchanged upstream baseline
        run: |
          git fetch --depth=1 origin 9cd0c74a96e0344763194ccbb28339846e6d2a45
          git checkout --detach 9cd0c74a96e0344763194ccbb28339846e6d2a45
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run unchanged smoke tests
        run: |
          set -o pipefail
          xvfb-run -a mvn -B -U -e verify -Pbuild-individual-bundles \
            -pl org.eclipse.jdt.ui.tests -am \
            -Dtest=SmokeViewsTest \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false \
            -Dcompare-version-with-baselines.skip=true \
            -DskipTests=false | tee startup-baseline-smoke.log
      - name: Collect complete workbench log
        if: always()
        run: |
          mkdir -p workbench-logs
          find org.eclipse.jdt.ui.tests/target -type f -name .log -exec cp --parents '{}' workbench-logs/ \;
          find workbench-logs -type f -exec tail -n 180 '{}' \;
      - name: Collect reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-baseline-smoke-reports
          include-hidden-files: true
          path: |
            startup-baseline-smoke.log
            workbench-logs/**
            **/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7
