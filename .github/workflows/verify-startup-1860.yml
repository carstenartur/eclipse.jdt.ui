name: Verify startup issue 1860

on:
  push:
    branches:
      - verify/startup-1860

permissions:
  contents: write

concurrency:
  group: verify-startup-1860
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply candidate to test-only baseline
        run: |
          cp .github/apply-startup-fix.py /tmp/apply-startup-fix.py
          git fetch --depth=1 origin 7ae190d97dcc2cbaec8d54d01d18a4b8a7b38f65
          git checkout --detach 7ae190d97dcc2cbaec8d54d01d18a4b8a7b38f65
          python /tmp/apply-startup-fix.py
          git diff --check
          git diff > startup-fix.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run complete package-view suite
        run: |
          set -o pipefail
          xvfb-run -a mvn -B -U -e verify -Pbuild-individual-bundles \
            -pl org.eclipse.jdt.ui.tests -am \
            -Dtest=PackageExplorerTests \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false \
            -Dcompare-version-with-baselines.skip=true \
            -DskipTests=false | tee startup-verification.log
      - name: Publish tested changes to dedicated fix branch
        run: |
          git config user.name 'Carsten Hammer'
          git config user.email 'carsten.hammer@t-online.de'
          git add org.eclipse.jdt.ui/ui/org/eclipse/jdt/ui/StandardJavaElementContentProvider.java \
            org.eclipse.jdt.ui/ui/org/eclipse/jdt/internal/ui/packageview/PackageExplorerContentProvider.java \
            org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/ui/tests/packageview/PackageExplorerTests.java
          git commit -m 'Avoid classpath initialization for parent handles and working-copy deltas' \
            -m 'Related to eclipse-jdt/eclipse.jdt.ui#1860 and eclipse-jdt/eclipse.jdt.core#3468.' \
            -m 'Assisted-by: OpenAI ChatGPT' \
            -m 'Signed-off-by: Carsten Hammer <carsten.hammer@t-online.de>'
          git push origin HEAD:refs/heads/fix/startup-1860
      - name: Collect reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-verification-reports
          path: |
            startup-verification.log
            startup-fix.patch
            **/target/surefire-reports/**
            **/target/work/data/.metadata/*.log
          if-no-files-found: warn
          retention-days: 7
