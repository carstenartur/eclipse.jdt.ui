name: Verify startup editor integration

on:
  push:
    branches:
      - verify/startup-1860-integration

permissions:
  contents: write

concurrency:
  group: verify-startup-1860-integration
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prepare integration regression
        run: |
          cp .github/apply-breadcrumb-defer.py /tmp/apply-breadcrumb-defer.py
          cp .github/*Startup*.java /tmp/
          git fetch --depth=1 origin 3a834a6e72f6a4812f7f475ab469d90107c3d8b9
          git checkout --detach 3a834a6e72f6a4812f7f475ab469d90107c3d8b9
          python /tmp/apply-breadcrumb-defer.py
          cp /tmp/*Startup*.java org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/ui/tests/packageview/
          python - <<'PY'
          from pathlib import Path
          p = Path('org.eclipse.jdt.ui.tests/plugin.xml')
          s = p.read_text()
          assert s.count('</plugin>') == 1
          extension = '''   <extension point="org.eclipse.jdt.core.classpathContainerInitializer">
                <classpathContainerInitializer
                      id="org.eclipse.jdt.ui.tests.startupContainer"
                      class="org.eclipse.jdt.ui.tests.packageview.StartupClasspathContainerInitializer">
                </classpathContainerInitializer>
             </extension>
          </plugin>'''
          p.write_text(s.replace('</plugin>', extension))
          p = Path('org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/ui/tests/packageview/PackageExplorerTests.java')
          s = p.read_text()
          assert s.count('\tStartupContentProviderTests.class,') == 1
          p.write_text(s.replace('\tStartupContentProviderTests.class,', '\tStartupContentProviderTests.class,\n\tBreadcrumbStartupTests.class,'))
          PY
          git add -N org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/ui/tests/packageview/BreadcrumbStartupTests.java \
            org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/ui/tests/packageview/StartupClasspathContainerInitializer.java
          git diff --check
          git diff > startup-integration-fix.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Exercise cold editor and complete package-view suite
        run: |
          set -o pipefail
          xvfb-run -a mvn -B -U -e verify -Pbuild-individual-bundles \
            -pl org.eclipse.jdt.ui.tests -am \
            -Dtest=PackageExplorerTests \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false \
            -Dcompare-version-with-baselines.skip=true \
            -DskipTests=false | tee startup-verification.log
      - name: Publish tested breadcrumb changes
        run: |
          git config user.name 'Carsten Hammer'
          git config user.email 'carsten.hammer@t-online.de'
          git add org.eclipse.jdt.ui/ui/org/eclipse/jdt/internal/ui/javaeditor/JavaEditorBreadcrumb.java \
            org.eclipse.jdt.ui.tests/plugin.xml \
            org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/ui/tests/packageview/PackageExplorerTests.java \
            org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/ui/tests/packageview/BreadcrumbStartupTests.java \
            org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/ui/tests/packageview/StartupClasspathContainerInitializer.java
          git commit -m 'Initialize breadcrumb models off the UI thread before rendering labels' \
            -m 'Keep the latest input and discard cancelled or disposed-editor callbacks. Cover cold editor creation with an instrumented classpath container.' \
            -m 'Assisted-by: OpenAI ChatGPT' \
            -m 'Signed-off-by: Carsten Hammer <carsten.hammer@t-online.de>'
          git push origin HEAD:refs/heads/fix/startup-1860
      - name: Collect reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-integration-reports
          path: |
            startup-verification.log
            startup-integration-fix.patch
            **/target/surefire-reports/**
            **/target/work/data/.metadata/*.log
          if-no-files-found: warn
          retention-days: 7
