name: Verify complete JDT UI test suites

on:
  push:
    branches:
      - verify/startup-1860

permissions:
  contents: read

concurrency:
  group: verify-startup-1860
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check out verified implementation
        run: |
          git fetch --depth=1 origin 14ebeffad1dc6b95d63b3c4f6df13cad31200eaa
          git checkout --detach 14ebeffad1dc6b95d63b3c4f6df13cad31200eaa
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run unfiltered JDT UI suites and dependencies
        run: |
          set -o pipefail
          xvfb-run -a mvn -B -U -e verify -Pbuild-individual-bundles \
            -pl org.eclipse.jdt.ui.tests -am \
            -Dcompare-version-with-baselines.skip=true \
            -DskipTests=false | tee startup-full-verification.log
      - name: Collect reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-full-ui-reports
          path: |
            startup-full-verification.log
            **/target/surefire-reports/**
            **/target/work/data/.metadata/*.log
          if-no-files-found: warn
          retention-days: 7
