name: Verify startup issue 1860

on:
  push:
    branches:
      - verify/startup-1860

permissions:
  contents: read

concurrency:
  group: verify-startup-1860
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check out test-only candidate
        run: |
          git fetch --depth=1 origin 7ae190d97dcc2cbaec8d54d01d18a4b8a7b38f65
          git checkout --detach 7ae190d97dcc2cbaec8d54d01d18a4b8a7b38f65
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run startup regressions
        run: |
          set -o pipefail
          xvfb-run -a mvn -B -U -e verify -Pbuild-individual-bundles \
            -pl org.eclipse.jdt.ui.tests -am \
            -Dtest=StartupContentProviderTests,ContentProviderTests7 \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false \
            -Dcompare-version-with-baselines.skip=true \
            -DskipTests=false | tee startup-verification.log
      - name: Collect reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-verification-reports
          path: |
            startup-verification.log
            **/target/surefire-reports/**
            **/target/work/data/.metadata/*.log
          if-no-files-found: warn
          retention-days: 7
