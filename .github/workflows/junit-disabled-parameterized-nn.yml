name: Disabled Parameterized JUnit N&N Screenshot

on:
  push:
    branches: [screenshots/junit-disabled-parameterized-3144]
    paths:
      - 'org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/DisabledParameterizedTestViewTest.java'
      - '.github/workflows/junit-disabled-parameterized-nn.yml'

permissions:
  contents: read

jobs:
  screenshot:
    if: github.repository == 'carstenartur/eclipse.jdt.ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install graphical test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox dbus-x11 libgtk-3-0t64 libxtst6 fonts-dejavu-core
      - name: Run focused JUnit UI test
        env:
          GTK_THEME: Adwaita
          GDK_BACKEND: x11
        run: |
          mkdir -p "$GITHUB_WORKSPACE/org.eclipse.jdt.ui.tests/target/screenshots"
          xvfb-run -a -s '-screen 0 1360x900x24' dbus-run-session -- bash -eu -o pipefail -c '
            openbox > /tmp/junit-disabled-nn-openbox.log 2>&1 &
            mvn -B -ntp               -Pbuild-individual-bundles               -Dcompare-version-with-baselines.skip=true               -Dscreenshots.dir="$GITHUB_WORKSPACE/org.eclipse.jdt.ui.tests/target/screenshots"               -Dtest=org.eclipse.jdt.junit.tests.DisabledParameterizedTestViewTest               -pl org.eclipse.jdt.ui.tests               test
          '
      - name: Upload screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-disabled-parameterized-nn
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            org.eclipse.jdt.ui.tests/target/screenshots/
            org.eclipse.jdt.ui.tests/target/surefire-reports/
            org.eclipse.jdt.ui.tests/target/work/.metadata/.log
