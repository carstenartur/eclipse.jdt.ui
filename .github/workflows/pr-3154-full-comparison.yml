name: PR 3154 full upstream-command comparison

on:
  push:
    branches: [diagnostic/pr-3154-jenkins-evidence]
    paths: [.github/workflows/pr-3154-full-comparison.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'carstenartur/eclipse.jdt.ui'
    name: Full reactor (${{ matrix.variant }})
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            sha: 6312a1cc907ad0a5ac5dd42e998eb0cbac686205
          - variant: pr
            sha: c482a9a8d17df6ff9fa3c44b3b604a94015b53f3
    env:
      VARIANT: ${{ matrix.variant }}
      EXPECTED_SHA: ${{ matrix.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install VNC display and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tigervnc-standalone-server libgtk-3-0 libasound2
      - name: Record exact source and environment
        run: |
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > evidence/source-sha.txt
          git diff --stat > evidence/source-diff.txt
          java -XshowSettings:properties -version 2> evidence/java.txt
          mvn -version > evidence/maven.txt
          cat /etc/os-release > evidence/os.txt
          find . -name '*.target' -print0 | sort -z | xargs -0 -r sha256sum > evidence/target-files.txt
          cat evidence/source-sha.txt evidence/java.txt evidence/maven.txt evidence/os.txt
      - name: Full Maven reactor with upstream Jenkins profiles
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvnc "$DISPLAY" -geometry 1280x1024 -depth 24 -SecurityTypes None -localhost -nolisten tcp -ac > evidence/vnc.log 2>&1 &
          vnc_pid=$!
          trap 'kill "$vnc_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then break; fi
            kill -0 "$vnc_pid"
            sleep 0.2
          done
          xdpyinfo -display "$DISPLAY" > evidence/display.txt
          set +e
          mvn -U -e -DskipTests=false -Dmaven.repo.local="$RUNNER_TEMP/m2-comparison" \
            clean verify --batch-mode --fail-at-end \
            -Pbree-libs -Papi-check -Pjavadoc -Pbuild-individual-bundles \
            -Dmaven.test.failure.ignore=true \
            -Dcompare-version-with-baselines.skip=false \
            2>&1 | tee evidence/maven.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > evidence/maven-exit.txt
          exit "$result"
      - name: Inspect actual test results without ignoring failures
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path('.')
          evidence = pathlib.Path('evidence')
          evidence.mkdir(exist_ok=True)
          cases = []
          malformed = []
          for report in sorted(root.glob('**/target/surefire-reports/TEST-*.xml')):
              try:
                  tree = ET.parse(report)
              except ET.ParseError as exc:
                  malformed.append(f'{report}: {exc}')
                  continue
              for case in tree.getroot().iter('testcase'):
                  problems = list(case.findall('failure')) + list(case.findall('error'))
                  item = {'class': case.get('classname', ''), 'name': case.get('name', ''), 'skipped': case.find('skipped') is not None, 'failed': bool(problems)}
                  cases.append(item)
                  for problem in problems:
                      print('FAILED:', item['class'], item['name'], problem.get('message'), problem.text, flush=True)
          required = {
              ('org.eclipse.jdt.junit.tests.TestRunListenerTest5', 'testTerminateLaunch'),
              ('org.eclipse.jdt.junit.tests.TestRunListenerTest6', 'testTerminateLaunch'),
          }
          if os.environ['VARIANT'] == 'pr':
              required.update(('org.eclipse.jdt.junit.tests.TestRunListenerTest5', name) for name in (
                  'testRetiredSessionTerminationDoesNotStopActiveSession',
                  'testRetiredSessionStopDoesNotStopActiveSession',
                  'testRetiredSessionEndDoesNotStopActiveSession',
                  'testActiveSessionTerminationStopsUpdateJobs',
                  'testActiveSessionStopStopsUpdateJobs',
                  'testActiveSessionEndStopsUpdateJobs',
              ))
          executed = {(c['class'], c['name']) for c in cases if not c['skipped']}
          exit_file = evidence / 'maven-exit.txt'
          maven_exit = int(exit_file.read_text()) if exit_file.exists() else None
          summary = {
              'variant': os.environ['VARIANT'], 'sha': os.environ['EXPECTED_SHA'],
              'tests': len(cases), 'skipped': sum(c['skipped'] for c in cases),
              'failures': [c for c in cases if c['failed']],
              'missing_required': sorted(required - executed),
              'malformed_reports': malformed, 'maven_exit': maven_exit,
          }
          (evidence / 'summary.json').write_text(json.dumps(summary, indent=2))
          (evidence / 'test-inventory.json').write_text(json.dumps(cases, indent=2))
          print('COMPARISON SUMMARY:', json.dumps(summary, indent=2), flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('```json\n' + json.dumps(summary, indent=2) + '\n```\n')
          assert maven_exit == 0, 'Maven did not complete successfully'
          assert len(cases) >= 9000, f'Full upstream-sized test inventory not confirmed: {len(cases)}'
          assert not malformed, 'Malformed XML reports'
          assert not summary['missing_required'], 'Required original or regression tests did not execute'
          assert not summary['failures'], 'Real test failures remain; Maven ignore flag does not make this check green'
          PY
      - name: Preserve source, environment, logs, and XML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-3154-full-${{ matrix.variant }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            evidence/
            **/target/surefire-reports/**
            **/target/work/data/.metadata/*.log
            **/target/work/configuration/org.eclipse.equinox.simpleconfigurator/bundles.info
            **/target/compilelogs/**
            **/target/apianalysis/**
