name: PR 3231 QA
on:
  push:
    branches: [verify/startup-1860-qa]
permissions:
  contents: read
concurrency:
  group: startup-1860-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply regression tests only
        run: |
          git apply .github/qa-regressions.patch
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install SWT browser runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-0
      - name: Verify regressions against current PR
        run: |
          set -o pipefail
          xvfb-run -a mvn -B -U -e verify -Pbuild-individual-bundles \
            -pl org.eclipse.jdt.ui.tests -am -Dtest=BreadcrumbStartupTests \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false \
            -Dcompare-version-with-baselines.skip=true -DskipTests=false | tee qa-red.log
      - name: Collect reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr3231-qa-reports
          include-hidden-files: true
          path: |
            qa-*.log
            **/target/surefire-reports/**
            **/target/work/data/.metadata/*.log
          retention-days: 7
