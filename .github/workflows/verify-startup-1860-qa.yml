name: PR 3231 QA
on:
  push:
    branches: [verify/startup-1860-qa]
permissions:
  contents: read
concurrency:
  group: startup-1860-qa
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        phase: [baseline, fixed]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply identical regression tests
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          git apply --recount .github/qa-regressions.patch
          if [ "$PHASE" = fixed ]; then git apply --recount .github/qa-production.patch; fi
          python - <<'PY'
          from pathlib import Path
          p = Path('org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/ui/tests/packageview/BreadcrumbStartupTests.java')
          s = p.read_text().replace('import java.lang.reflect.Field;', 'import java.lang.reflect.Field;\nimport java.util.Arrays;')
          s = s.replace('import org.eclipse.ui.part.FileEditorInput;', 'import org.eclipse.ui.part.FileEditorInput;\nimport org.eclipse.ui.progress.UIJob;')
          s = s.replace('Job[] jobs= Job.getJobManager().find(breadcrumb);', 'Job[] jobs= Arrays.stream(Job.getJobManager().find(breadcrumb)).filter(job -> !(job instanceof UIJob)).toArray(Job[]::new);')
          p.write_text(s)
          PY
          python .github/qa-refine-tests.py
          git diff --check
          git diff > qa-candidate.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install SWT browser runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-0
      - name: Verify focused regressions
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          set +e
          set -o pipefail
          xvfb-run -a mvn -B -U -e verify -Pbuild-individual-bundles \
            -pl org.eclipse.jdt.ui.tests -am -Dtest=BreadcrumbStartupTests \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false \
            -Dcompare-version-with-baselines.skip=true -DskipTests=false | tee qa-focused.log
          rc=$?
          set -e
          echo "$rc" > qa-exit-code.txt
          if [ "$PHASE" = fixed ]; then test "$rc" = 0; else
            test "$rc" != 0
            python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          reports = list(Path('org.eclipse.jdt.ui.tests/target/surefire-reports').glob('TEST-*.xml'))
          assert reports, 'No test reports; infrastructure failure is not a red test'
          failed = []
          for p in reports:
              root = E.parse(p).getroot()
              assert int(root.get('errors', 0)) == 0, p
              failed += [c.get('name') for c in root.iter('testcase') if c.find('failure') is not None]
          print('Confirmed failing regressions:', failed)
          assert 'classpathChangeBeforeFirstPublicationInvalidatesCompletedWorker' in failed
          PY
          fi
          mkdir -p verified-reports/focused
          cp org.eclipse.jdt.ui.tests/target/surefire-reports/* verified-reports/focused/
      - name: Run package-view suite
        if: matrix.phase == 'fixed'
        run: |
          set -o pipefail
          xvfb-run -a mvn -B -e verify -Pbuild-individual-bundles \
            -pl org.eclipse.jdt.ui.tests -am -Dtest=PackageExplorerTests \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false \
            -Dcompare-version-with-baselines.skip=true -DskipTests=false | tee qa-package.log
          mkdir -p verified-reports/package
          cp org.eclipse.jdt.ui.tests/target/surefire-reports/* verified-reports/package/
      - name: Repeat concurrency scenarios
        if: matrix.phase == 'fixed'
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            xvfb-run -a mvn -B -e verify -Pbuild-individual-bundles \
              -pl org.eclipse.jdt.ui.tests -am -Dtest=BreadcrumbStartupTests \
              -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false \
              -Dcompare-version-with-baselines.skip=true -DskipTests=false | tee "qa-repeat-${attempt}.log"
            mkdir -p "verified-reports/repeat-${attempt}"
            cp org.eclipse.jdt.ui.tests/target/surefire-reports/* "verified-reports/repeat-${attempt}/"
          done
      - name: Run unfiltered JDT UI module suites
        if: matrix.phase == 'fixed'
        run: |
          set -o pipefail
          xvfb-run -a mvn -B -U -e verify -Pbuild-individual-bundles \
            -pl org.eclipse.jdt.ui.tests -am \
            -Dcompare-version-with-baselines.skip=true -DskipTests=false | tee qa-full.log
          mkdir -p verified-reports/full
          cp org.eclipse.jdt.ui.tests/target/surefire-reports/* verified-reports/full/
      - name: Collect reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr3231-qa-${{ matrix.phase }}
          include-hidden-files: true
          path: |
            qa-*.log
            qa-exit-code.txt
            qa-candidate.patch
            verified-reports/**
            **/target/surefire-reports/**
            **/target/work/data/.metadata/*.log
          retention-days: 7
