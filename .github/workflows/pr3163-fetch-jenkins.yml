name: Fetch PR 3163 Jenkins failure

on:
  push:
    branches:
      - debug/pr3163-jenkins

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public Jenkins pages
        shell: bash
        run: |
          set +e
          base='https://ci.eclipse.org/jdt/job/eclipse.jdt.ui-github/job/PR-3163/13'
          for suffix in consoleText testReport/; do
            echo "=== $suffix ==="
            curl -L --fail-with-body -A 'Mozilla/5.0' "$base/$suffix" -o out.txt
            rc=$?
            echo "curl rc=$rc bytes=$(wc -c < out.txt 2>/dev/null || echo 0)"
            if [ -s out.txt ]; then
              grep -E -i -C 4 'failure|error|failed|Tests run:|TestRunSessionHistory|timing|AssertionError|BUILD ' out.txt | tail -n 2000 || true
            fi
          done
