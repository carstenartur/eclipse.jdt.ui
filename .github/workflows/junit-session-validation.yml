name: JUnit session race validation

on:
  push:
    branches: [ci/3152-junit-session-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  junit:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libasound2
      - name: Use original product code for negative control
        if: matrix.variant == 'before'
        run: |
          git show af8e9e9bd1162a87538a9fd7e6ea2d85a808de6c:org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/TestRunnerViewPart.java > org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/TestRunnerViewPart.java
      - name: Run JUnit launch and lifecycle tests in Eclipse
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          xvfb-run -a mvn -B -ntp verify -Pbuild-individual-bundles -pl org.eclipse.jdt.ui.tests -am -DskipTests=false -Dmaven.test.skip=false -Dtest=TestRunListenerTest5,TestRunListenerTest6 -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee junit-validation.log
      - name: Verify regression tests actually executed
        env:
          VARIANT: ${{ matrix.variant }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          cases = {}
          for path in pathlib.Path('org.eclipse.jdt.ui.tests/target').rglob('TEST-*.xml'):
              for case in ET.parse(path).getroot().iter('testcase'):
                  cases[(case.get('classname'), case.get('name'))] = case
          cls = 'org.eclipse.jdt.junit.tests.TestRunListenerTest5'
          retired = ['testRetiredSessionTerminationDoesNotStopActiveSession', 'testRetiredSessionStopDoesNotStopActiveSession', 'testRetiredSessionEndDoesNotStopActiveSession']
          required = [(cls, name) for name in retired + ['testActiveSessionTerminationStopsUpdateJobs', 'testTerminateLaunch']]
          required += [('org.eclipse.jdt.junit.tests.TestRunListenerTest6', 'testTerminateLaunch')]
          for key in required:
              assert key in cases, f'Test not executed: {key}'
              assert cases[key].find('skipped') is None, f'Test skipped: {key}'
          failed = {key for key, case in cases.items() if case.find('failure') is not None or case.find('error') is not None}
          if os.environ['VARIANT'] == 'before':
              expected = {(cls, name) for name in retired}
              assert failed == expected, f'Expected exactly the three retired-session regressions, got {failed}'
              assert os.environ['TEST_OUTCOME'] == 'failure'
          else:
              assert not failed, f'Unexpected failures: {failed}'
              assert os.environ['TEST_OUTCOME'] == 'success'
          summary = f"{os.environ['VARIANT']}: {len(cases)} tests recorded; {len(failed)} failures; required tests verified."
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary + '\n')
          PY
      - name: Preserve test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-session-${{ matrix.variant }}
          if-no-files-found: error
          path: |
            junit-validation.log
            **/target/surefire-reports/**
            **/target/work/data/.metadata/.log
