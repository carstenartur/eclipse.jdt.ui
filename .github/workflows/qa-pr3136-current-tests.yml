name: PR3136 current targeted tests

on:
  push:
    branches:
      - qa-pr3136-current-tests

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build affected bundles
        run: >-
          mvn -B -ntp -Pbuild-individual-bundles
          -DskipTests=true
          -pl org.eclipse.jdt.ui.tests
          -am install

      - name: Run targeted EnumSource tests
        shell: bash
        run: |
          set +e
          xvfb-run --auto-servernum mvn -B -ntp -Pbuild-individual-bundles \
            -pl org.eclipse.jdt.ui.tests \
            -Dtest=org.eclipse.jdt.junit.tests.EnumSourceFilterTest,org.eclipse.jdt.junit.tests.EnumSourceSafetyTest \
            test 2>&1 | tee /tmp/targeted-tests.log
          status=${PIPESTATUS[0]}
          echo "Maven exit status: ${status}"
          echo "===== Test reports ====="
          find . -type f \( -path '*/surefire-reports/*' -o -path '*/failsafe-reports/*' \) \
            -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; || true
          echo "===== Last 300 Maven log lines ====="
          tail -n 300 /tmp/targeted-tests.log || true
          exit "${status}"
