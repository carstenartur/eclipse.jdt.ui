name: Resolve coordinated preview branch onto current master

on:
  push:
    branches:
      - feature/coordinated-cleanup-preview-4.40
    paths:
      - '.github/workflows/merge-master-into-coordinated-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MASTER: 6cf5001153897a303ac144790a28eda266287663
      PR_BASE: c9a174e62c32be00bd14c368524d36de75e9fd0f
      CLEANUP_FILE: org.eclipse.jdt.ui/core extension/org/eclipse/jdt/internal/corext/fix/CleanUpRefactoring.java
      SCOPE_TEST: org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/ui/tests/quickfix/MultiFileCleanUpScopeExpansionTest.java
      FORK_FILES: .github/fork-specific-files.txt
      WORKFLOW_FILE: .github/workflows/merge-master-into-coordinated-preview.yml
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge pinned master with explicit conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          actual_master="$(git rev-parse origin/master)"
          if [[ "$actual_master" != "$EXPECTED_MASTER" ]]; then
            echo "master moved: expected $EXPECTED_MASTER, found $actual_master" >&2
            exit 1
          fi

          original_head="$(git rev-parse HEAD)"
          git diff "$PR_BASE" "$original_head" -- "$CLEANUP_FILE" > /tmp/coordinated-preview.patch
          if [[ ! -s /tmp/coordinated-preview.patch ]]; then
            echo "No coordinated preview patch was produced." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-ff --no-commit "$EXPECTED_MASTER"
          merge_status=$?
          set -e
          if [[ "$merge_status" -eq 0 ]]; then
            echo "Expected the known independent scope-expansion conflicts, but merge was clean." >&2
            exit 1
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          expected=("$FORK_FILES" "$SCOPE_TEST" "$CLEANUP_FILE")
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${conflicts[@]}")" != "$(printf '%s\n' "${expected[@]}")" ]]; then
            printf 'Unexpected conflicts:\n%s\n' "${conflicts[*]}" >&2
            exit 1
          fi

          git show ":2:$FORK_FILES" > /tmp/fork-files-head.txt
          git show ":3:$FORK_FILES" > "$FORK_FILES"
          while IFS= read -r line || [[ -n "$line" ]]; do
            if ! grep -Fqx -- "$line" "$FORK_FILES"; then
              printf '%s\n' "$line" >> "$FORK_FILES"
            fi
          done < /tmp/fork-files-head.txt
          git add "$FORK_FILES"

          git checkout --theirs -- "$SCOPE_TEST"
          git add "$SCOPE_TEST"

          git checkout --theirs -- "$CLEANUP_FILE"
          git add "$CLEANUP_FILE"
          git apply --index --3way /tmp/coordinated-preview.patch

          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- "$CLEANUP_FILE" "$SCOPE_TEST" "$FORK_FILES"; then
            echo "Conflict markers remain after resolution." >&2
            exit 1
          fi
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unmerged paths remain after resolution." >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git rm "$WORKFLOW_FILE"
          git diff --cached --check
          git commit -m "Merge current master into coordinated Cleanup preview branch"
          git push origin "HEAD:${GITHUB_REF_NAME}"
