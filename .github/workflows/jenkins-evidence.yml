name: Collect PR 3152 Jenkins evidence

on:
  push:
    branches: [ci/3152-jenkins-evidence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Fetch public build logs and test reports
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request
          import urllib.parse
          root = pathlib.Path('jenkins-evidence')
          root.mkdir()
          base = 'https://ci.eclipse.org/jdt/job/eclipse.jdt.ui-github/job/PR-3152/'
          successes = 0
          def fetch(url, path):
              global successes
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'PR3152-diagnostics'})
                  with urllib.request.urlopen(req, timeout=35) as response:
                      data = response.read(32 * 1024 * 1024 + 1)
                  if len(data) > 32 * 1024 * 1024:
                      raise ValueError('Response exceeds diagnostic size limit')
                  path.write_bytes(data)
                  print(f'{path}: {len(data)} bytes')
                  successes += 1
                  return data
              except Exception as error:
                  path.with_suffix(path.suffix + '.error.txt').write_text(str(error))
                  print(f'{path}: {error}')
                  return None
          for build in (1, 2):
              out = root / str(build)
              out.mkdir()
              fetch(base + str(build) + '/consoleText', out / 'console.log')
              tree = 'failCount,skipCount,passCount,suites[name,stdout,stderr,cases[className,name,status,errorDetails,errorStackTrace,stdout,stderr]]'
              data = fetch(base + str(build) + '/testReport/api/json?' + urllib.parse.urlencode({'tree': tree}), out / 'test-report.json')
              if data:
                  report = json.loads(data)
                  failures = [case for suite in report.get('suites', []) for case in suite.get('cases', []) if case.get('status') in ('FAILED', 'REGRESSION')]
                  (out / 'failures.json').write_text(json.dumps(failures, indent=2))
                  print(f'Build {build}: {len(failures)} failed tests')
              metadata = fetch(base + str(build) + '/api/json?' + urllib.parse.urlencode({'tree': 'result,building,artifacts[fileName,relativePath]'}), out / 'build.json')
              if metadata:
                  artifacts = json.loads(metadata).get('artifacts', [])
                  logs = [a for a in artifacts if a['relativePath'].endswith('.log') and 'org.eclipse.jdt.ui.tests' in a['relativePath']]
                  for index, artifact in enumerate(logs[:4]):
                      fetch(base + str(build) + '/artifact/' + urllib.parse.quote(artifact['relativePath'], safe='/'), out / f'archived-{index}.log')
          assert successes, 'No public Jenkins evidence could be retrieved'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr3152-jenkins-evidence
          if-no-files-found: error
          path: jenkins-evidence/
