name: PR 3163 targeted history tests

on:
  push:
    branches:
      - debug/pr3163-jenkins

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1
        with:
          maven-version: 3.9.9
      - name: Run history test class
        run: |
          xvfb-run -a mvn -U -e --batch-mode \
            -pl org.eclipse.jdt.ui.tests -am verify \
            -DskipTests=false \
            -Dtest=org.eclipse.jdt.junit.tests.TestRunSessionHistoryTests \
            -DfailIfNoTests=false \
            -Pbree-libs -Pbuild-individual-bundles
