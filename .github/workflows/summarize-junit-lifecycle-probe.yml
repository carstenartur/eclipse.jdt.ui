name: Summarize JUnit lifecycle probe

on:
  push:
    branches:
      - diagnose/3152-junit-launch
    paths:
      - .github/workflows/summarize-junit-lifecycle-probe.yml

permissions:
  actions: read
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Extract the actual PDE regression result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import io, os, re, urllib.request, zipfile
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected is not None:
                      redirected.remove_header('Authorization')
                      redirected.remove_header('Accept')
                  return redirected
          opener = urllib.request.build_opener(SafeRedirect())
          url = 'https://api.github.com/repos/carstenartur/eclipse.jdt.ui/actions/jobs/101316260516/logs'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'jdt-lifecycle-regression-summary'})
          with opener.open(request, timeout=60) as response:
              data = response.read()
          if data.startswith(b'PK'):
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  text = '\n'.join(archive.read(n).decode('utf-8', 'replace') for n in archive.namelist() if not n.endswith('/'))
          else:
              text = data.decode('utf-8', 'replace')
          lines = text.splitlines()
          wanted = set()
          pattern = re.compile(r'ACTUAL PDE TEST RESULT|LIFECYCLE_PROBE|PDE_PROBE_EXECUTED|Tests run:|<<< FAILURE|<<< ERROR|BUILD FAILURE|BUILD SUCCESS|A retired session|NoSuchMethod|NoSuchField|The notification must complete|The regression probe requires')
          for i, line in enumerate(lines):
              if '\x1b[' not in line and pattern.search(line):
                  wanted.update(range(max(0, i-1), min(len(lines), i+8)))
          output = '\n'.join(f'{i+1}: {lines[i]}' for i in sorted(wanted))[:20000]
          print('BASELINE_SOURCE_JOB 101316260516')
          print('TOTAL_LOG_LINES', len(lines))
          print(output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'w') as summary:
              summary.write('## Actual PDE baseline evidence\n\n```text\n' + output + '\n```\n')
          if not wanted:
              raise SystemExit('No regression result found in the original log')
