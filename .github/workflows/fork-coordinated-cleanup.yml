name: Fork Coordinated Cleanup Verification

on:
  push:
    branches:
      - feature/coordinated-cleanup-preview-4.40
    paths:
      - 'org.eclipse.jdt.ui/**'
      - 'org.eclipse.jdt.ui.tests/**'
      - '.github/fork-specific-files.txt'
      - '.github/workflows/fork-coordinated-cleanup.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  coordinated-cleanup-preview:
    name: Coordinated Cleanup preview test
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MAVEN_OPTS: -Xmx4g
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Install Eclipse test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgtk-3-0 libxext6 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxfixes3 libasound2t64 libnss3 libgbm1

      - name: Build JDT UI and run coordinated preview test
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "Maven/Tycho verification attempt ${attempt}/3"
            if xvfb-run --auto-servernum mvn \
              --no-transfer-progress \
              --batch-mode \
              -e \
              -V \
              -U \
              -Dmaven.wagon.http.retryHandler.count=5 \
              -Pbuild-individual-bundles \
              -pl org.eclipse.jdt.ui.tests \
              -am \
              -Dtest=org.eclipse.jdt.ui.tests.quickfix.CoordinatedCleanUpPreviewTest \
              -DfailIfNoTests=false \
              clean verify; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Maven/Tycho verification failed after three attempts." >&2
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Require coordinated preview test evidence
        shell: bash
        run: |
          set -euo pipefail
          report="$(find org.eclipse.jdt.ui.tests/target/surefire-reports \
            -type f -name '*CoordinatedCleanUpPreviewTest*' -print -quit)"
          if [[ -z "$report" ]]; then
            echo "No test report was produced for CoordinatedCleanUpPreviewTest." >&2
            find org.eclipse.jdt.ui.tests/target -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "Verified report: $report"

      - name: Publish JUnit annotations
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          summary: true
          include_passed: false
          detailed_summary: true

      - name: Upload test reports and Eclipse logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coordinated-cleanup-preview-${{ github.run_number }}
          path: |
            **/target/surefire-reports/**
            **/target/work/data/.metadata/*.log
          retention-days: 14
          if-no-files-found: warn
