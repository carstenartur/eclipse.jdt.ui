name: QA issue 3128 reload imported test results

on:
  push:
    branches:
      - qa-issue-3128-reload-imported-test-results
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-3128-reload-imported-test-results
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check patch formatting
        run: git diff --check 0988286fe64cc3d6fd3d65fe398488203743f30d...HEAD

      - name: Build affected reactor
        run: >-
          mvn -B -ntp -U
          -Pbuild-individual-bundles
          -DskipTests=true
          -Dcompare-version-with-baselines.skip=true
          -pl org.eclipse.jdt.ui.tests
          -am install

      - name: Run reload and serialization tests
        run: >-
          xvfb-run --auto-servernum
          mvn -B -ntp
          -Pbuild-individual-bundles
          -Dcompare-version-with-baselines.skip=true
          -pl org.eclipse.jdt.ui.tests
          -Dtest=org.eclipse.jdt.junit.tests.ImportedTestRunReloadTest,org.eclipse.jdt.junit.tests.TestRunSessionSerializationTests3,org.eclipse.jdt.junit.tests.TestRunSessionSerializationTests4
          test

      - name: Run complete JUnit plug-in test suite
        run: >-
          xvfb-run --auto-servernum
          mvn -B -ntp
          -Pbuild-individual-bundles
          -Dcompare-version-with-baselines.skip=true
          -pl org.eclipse.jdt.ui.tests
          -Dtest=org.eclipse.jdt.junit.tests.JUnitJUnitTests
          test
