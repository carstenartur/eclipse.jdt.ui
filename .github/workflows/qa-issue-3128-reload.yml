name: QA issue 3128 reload imported test results

on:
  push:
    branches:
      - qa-issue-3128-reload-imported-test-results

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa-issue-3128-reload-imported-test-results
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply implementation
        shell: bash
        run: |
          python3 <<'PY'
          import base64
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              path.write_text(source.replace(old, new), encoding="utf-8")

          core_manifest = Path("org.eclipse.jdt.junit.core/META-INF/MANIFEST.MF")
          replace_once(core_manifest, "Bundle-Version: 3.15.0.qualifier",
                       "Bundle-Version: 3.15.100.qualifier")

          ui_manifest = Path("org.eclipse.jdt.junit/META-INF/MANIFEST.MF")
          replace_once(ui_manifest, "Bundle-Version: 3.17.600.qualifier",
                       "Bundle-Version: 3.17.700.qualifier")

          session = Path("org.eclipse.jdt.junit.core/src/org/eclipse/jdt/internal/junit/model/TestRunSession.java")
          replace_once(session, "Copyright (c) 2000, 2018 IBM Corporation and others.",
                       "Copyright (c) 2000, 2026 IBM Corporation and others.")
          replace_once(
              session,
              " *     Thirumala Reddy Mutchukota <thirumala@google.com> - [JUnit] Avoid rerun test launch on UI thread - https://bugs.eclipse.org/bugs/show_bug.cgi?id=411841\n",
              " *     Thirumala Reddy Mutchukota <thirumala@google.com> - [JUnit] Avoid rerun test launch on UI thread - https://bugs.eclipse.org/bugs/show_bug.cgi?id=411841\n"
              " *     Carsten Hammer - reload imported test runs\n",
          )
          replace_once(session, "import java.io.File;\nimport java.text.DateFormat;",
                       "import java.io.File;\nimport java.nio.file.Path;\nimport java.text.DateFormat;")
          replace_once(
              session,
              "\tprivate final IJavaProject fProject;\n\n\tprivate final ITestKind fTestRunnerKind;",
              "\tprivate final IJavaProject fProject;\n\n"
              "\t/**\n"
              "\t * Source file of an imported test run, or <code>null</code> for launched and URL-imported sessions.\n"
              "\t */\n"
              "\tprivate Path fImportedFromFile;\n\n"
              "\tprivate final ITestKind fTestRunnerKind;",
          )
          replace_once(
              session,
              "\tvoid reset() {\n"
              "\t\tfStartedCount= 0;\n"
              "\t\tfFailureCount= 0;\n"
              "\t\tfAssumptionFailureCount = 0;\n"
              "\t\tfErrorCount= 0;\n"
              "\t\tfIgnoredCount= 0;\n"
              "\t\tfTotalCount= 0;\n\n"
              "\t\tfTestRoot= new TestRoot(this);\n"
              "\t\tfTestResult= null;\n"
              "\t\tfIdToTest= new HashMap<>();\n"
              "\t}\n\n"
              "\t@Override\n"
              "\tpublic ProgressState getProgressState() {",
              "\tvoid reset() {\n"
              "\t\tfStartedCount= 0;\n"
              "\t\tfFailureCount= 0;\n"
              "\t\tfAssumptionFailureCount = 0;\n"
              "\t\tfErrorCount= 0;\n"
              "\t\tfIgnoredCount= 0;\n"
              "\t\tfTotalCount= 0;\n\n"
              "\t\tfTestRoot= new TestRoot(this);\n"
              "\t\tfTestResult= null;\n"
              "\t\tfIdToTest= new HashMap<>();\n"
              "\t}\n\n"
              "\t/**\n"
              "\t * Returns the source file from which this test run was imported.\n"
              "\t *\n"
              "\t * @return the normalized absolute source path, or <code>null</code>\n"
              "\t */\n"
              "\tpublic Path getImportedFromFile() {\n"
              "\t\treturn fImportedFromFile;\n"
              "\t}\n\n"
              "\tvoid setImportedFromFile(Path sourceFile) {\n"
              "\t\tfImportedFromFile= sourceFile;\n"
              "\t}\n\n"
              "\t@Override\n"
              "\tpublic ProgressState getProgressState() {",
          )

          model = Path("org.eclipse.jdt.junit.core/src/org/eclipse/jdt/internal/junit/model/JUnitModel.java")
          replace_once(model, "Copyright (c) 2000, 2016 IBM Corporation and others.",
                       "Copyright (c) 2000, 2026 IBM Corporation and others.")
          replace_once(
              model,
              " *     Achim Demelt <a.demelt@exxcellent.de> - [JUnit] Separate UI from non-UI code - https://bugs.eclipse.org/bugs/show_bug.cgi?id=278844\n",
              " *     Achim Demelt <a.demelt@exxcellent.de> - [JUnit] Separate UI from non-UI code - https://bugs.eclipse.org/bugs/show_bug.cgi?id=278844\n"
              " *     Carsten Hammer - reload imported test runs\n",
          )
          replace_once(model, "import java.lang.reflect.InvocationTargetException;\nimport java.util.ArrayList;",
                       "import java.lang.reflect.InvocationTargetException;\nimport java.nio.file.Path;\nimport java.util.ArrayList;")
          replace_once(
              model,
              "\tpublic static TestRunSession importTestRunSession(File file) throws CoreException {\n"
              "\t\ttry {\n"
              "\t\t\tSAXParserFactory parserFactory= XmlProcessorFactoryJdtJunit.createSAXFactoryWithErrorOnDOCTYPE();\n"
              "//\t\t\tparserFactory.setValidating(true); // TODO: add DTD and debug flag\n"
              "\t\t\tSAXParser parser= parserFactory.newSAXParser();\n"
              "\t\t\tTestRunHandler handler= new TestRunHandler();\n"
              "\t\t\tparser.parse(file, handler);\n"
              "\t\t\tTestRunSession session= handler.getTestRunSession();\n"
              "\t\t\tJUnitCorePlugin.getModel().addTestRunSession(session);\n"
              "\t\t\treturn session;\n"
              "\t\t} catch (ParserConfigurationException | SAXException e) {\n"
              "\t\t\tthrowImportError(file, e);\n"
              "\t\t} catch (IOException e) {\n"
              "\t\t\tthrowImportError(file, e);\n"
              "\t\t} catch (IllegalArgumentException e) {\n"
              "\t\t\t// Bug in parser: can throw IAE even if file is not null\n"
              "\t\t\tthrowImportError(file, e);\n"
              "\t\t}\n"
              "\t\treturn null; // does not happen\n"
              "\t}\n",
              "\tpublic static TestRunSession importTestRunSession(File file) throws CoreException {\n"
              "\t\tPath sourceFile= file.toPath().toAbsolutePath().normalize();\n"
              "\t\tTestRunSession session= readTestRunSession(sourceFile.toFile());\n"
              "\t\tsession.setImportedFromFile(sourceFile);\n"
              "\t\tJUnitCorePlugin.getModel().addTestRunSession(session);\n"
              "\t\treturn session;\n"
              "\t}\n\n"
              "\t/**\n"
              "\t * Reloads a previously file-imported test run and replaces it in the model only after\n"
              "\t * the updated XML has been parsed successfully.\n"
              "\t *\n"
              "\t * @param testRunSession the imported session to replace\n"
              "\t * @return the replacement session, or <code>null</code> if the original session is no longer registered\n"
              "\t * @throws CoreException if the source file cannot be read or parsed\n"
              "\t */\n"
              "\tpublic static TestRunSession reloadTestRunSession(TestRunSession testRunSession) throws CoreException {\n"
              "\t\tAssert.isNotNull(testRunSession);\n"
              "\t\tPath sourceFile= testRunSession.getImportedFromFile();\n"
              "\t\tAssert.isNotNull(sourceFile);\n\n"
              "\t\tTestRunSession replacement= readTestRunSession(sourceFile.toFile());\n"
              "\t\treplacement.setImportedFromFile(sourceFile);\n"
              "\t\tif (!JUnitCorePlugin.getModel().replaceTestRunSession(testRunSession, replacement)) {\n"
              "\t\t\treturn null;\n"
              "\t\t}\n"
              "\t\treturn replacement;\n"
              "\t}\n\n"
              "\tprivate static TestRunSession readTestRunSession(File file) throws CoreException {\n"
              "\t\ttry {\n"
              "\t\t\tSAXParserFactory parserFactory= XmlProcessorFactoryJdtJunit.createSAXFactoryWithErrorOnDOCTYPE();\n"
              "//\t\t\tparserFactory.setValidating(true); // TODO: add DTD and debug flag\n"
              "\t\t\tSAXParser parser= parserFactory.newSAXParser();\n"
              "\t\t\tTestRunHandler handler= new TestRunHandler();\n"
              "\t\t\tparser.parse(file, handler);\n"
              "\t\t\treturn handler.getTestRunSession();\n"
              "\t\t} catch (ParserConfigurationException | SAXException e) {\n"
              "\t\t\tthrowImportError(file, e);\n"
              "\t\t} catch (IOException e) {\n"
              "\t\t\tthrowImportError(file, e);\n"
              "\t\t} catch (IllegalArgumentException e) {\n"
              "\t\t\t// Bug in parser: can throw IAE even if file is not null\n"
              "\t\t\tthrowImportError(file, e);\n"
              "\t\t}\n"
              "\t\treturn null; // does not happen\n"
              "\t}\n",
          )
          replace_once(
              model,
              "\t/**\n"
              "\t * Removes the given {@link TestRunSession} and notifies all registered\n",
              "\tprivate boolean replaceTestRunSession(TestRunSession oldSession, TestRunSession newSession) {\n"
              "\t\tsynchronized (this) {\n"
              "\t\t\tint index= fTestRunSessions.indexOf(oldSession);\n"
              "\t\t\tif (index < 0) {\n"
              "\t\t\t\treturn false;\n"
              "\t\t\t}\n"
              "\t\t\tfTestRunSessions.set(index, newSession);\n"
              "\t\t}\n\n"
              "\t\tnotifyTestRunSessionRemoved(oldSession);\n"
              "\t\toldSession.removeSwapFile();\n"
              "\t\tnotifyTestRunSessionAdded(newSession);\n"
              "\t\treturn true;\n"
              "\t}\n\n"
              "\t/**\n"
              "\t * Removes the given {@link TestRunSession} and notifies all registered\n",
          )

          watcher = Path("org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/ImportedTestRunFileWatcher.java")
          watcher.write_bytes(base64.b64decode(""))

          view = Path("org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/TestRunnerViewPart.java")
          replace_once(view, "Copyright (c) 2000, 2024 IBM Corporation and others.",
                       "Copyright (c) 2000, 2026 IBM Corporation and others.")
          replace_once(
              view,
              " *     Sandra Lions <sandra.lions-piron@oracle.com> - [junit] allow to sort by name and by execution time - https://bugs.eclipse.org/bugs/show_bug.cgi?id=219466\n",
              " *     Sandra Lions <sandra.lions-piron@oracle.com> - [junit] allow to sort by name and by execution time - https://bugs.eclipse.org/bugs/show_bug.cgi?id=219466\n"
              " *     Carsten Hammer - reload imported test runs\n",
          )
          replace_once(view, "import java.nio.charset.StandardCharsets;\nimport java.text.DateFormat;",
                       "import java.nio.charset.StandardCharsets;\nimport java.nio.file.Path;\nimport java.text.DateFormat;")
          replace_once(view, "import org.eclipse.ui.IMemento;\nimport org.eclipse.ui.IPartListener2;",
                       "import org.eclipse.ui.IMemento;\nimport org.eclipse.ui.IPartListener2;\nimport org.eclipse.ui.ISharedImages;")
          replace_once(
              view,
              "\tprivate Action fRerunFailedFirstAction;\n\tprivate IHandlerActivation fRerunFailedFirstActivation;\n\n"
              "\tprivate Action fFailuresOnlyFilterAction;",
              "\tprivate Action fRerunFailedFirstAction;\n"
              "\tprivate IHandlerActivation fRerunFailedFirstActivation;\n"
              "\tprivate ReloadTestRunAction fReloadTestRunAction;\n"
              "\tprivate AutoReloadTestRunAction fAutoReloadTestRunAction;\n\n"
              "\tprivate Action fFailuresOnlyFilterAction;",
          )
          replace_once(
              view,
              "\tprivate TestRunSession fTestRunSession;\n\tprivate TestSessionListener fTestSessionListener;\n",
              "\tprivate TestRunSession fTestRunSession;\n"
              "\tprivate TestSessionListener fTestSessionListener;\n"
              "\tprivate ImportedTestRunFileWatcher fImportedTestRunFileWatcher;\n"
              "\tprivate Job fReloadTestRunJob;\n",
          )
          replace_once(
              view,
              "\tstatic final String TAG_SORTING_CRITERION= \"sortingCriterion\"; //$NON-NLS-1$\n",
              "\tstatic final String TAG_SORTING_CRITERION= \"sortingCriterion\"; //$NON-NLS-1$\n"
              "\tstatic final String TAG_AUTO_RELOAD= \"autoReloadImportedTestRun\"; //$NON-NLS-1$\n",
          )
          replace_once(
              view,
              "\t\tmemento.putInteger(TAG_SORTING_CRITERION, fSortingCriterion.ordinal());\n",
              "\t\tmemento.putInteger(TAG_SORTING_CRITERION, fSortingCriterion.ordinal());\n"
              "\t\tmemento.putString(TAG_AUTO_RELOAD, fAutoReloadTestRunAction.isChecked() ? \"true\" : \"false\"); //$NON-NLS-1$ //$NON-NLS-2$\n",
          )
          replace_once(
              view,
              "\t\tString time= memento.getString(TAG_SHOW_TIME);\n"
              "\t\tboolean showTime= true;\n"
              "\t\tif (time != null)\n"
              "\t\t\tshowTime= \"true\".equals(time); //$NON-NLS-1$\n\n",
              "\t\tString time= memento.getString(TAG_SHOW_TIME);\n"
              "\t\tboolean showTime= true;\n"
              "\t\tif (time != null)\n"
              "\t\t\tshowTime= \"true\".equals(time); //$NON-NLS-1$\n\n"
              "\t\tString autoReload= memento.getString(TAG_AUTO_RELOAD);\n"
              "\t\tif (autoReload != null) {\n"
              "\t\t\tfAutoReloadTestRunAction.setChecked(\"true\".equals(autoReload)); //$NON-NLS-1$\n"
              "\t\t}\n\n",
          )
          replace_once(
              view,
              "\t\tsetFilterAndLayout(showFailuresOnly, showIgnoredOnly, layoutValue);\n"
              "\t\tsetShowExecutionTime(showTime);\n"
              "\t}\n",
              "\t\tsetFilterAndLayout(showFailuresOnly, showIgnoredOnly, layoutValue);\n"
              "\t\tsetShowExecutionTime(showTime);\n"
              "\t\tupdateImportedTestRunActions();\n"
              "\t}\n",
          )
          replace_once(
              view,
              "\t\tfStopAction= new StopAction();\n"
              "\t\tfStopAction.setEnabled(false);\n\n"
              "\t\tfRerunLastTestAction= new RerunLastAction();",
              "\t\tfStopAction= new StopAction();\n"
              "\t\tfStopAction.setEnabled(false);\n"
              "\t\tfReloadTestRunAction= new ReloadTestRunAction();\n"
              "\t\tfAutoReloadTestRunAction= new AutoReloadTestRunAction();\n"
              "\t\tfImportedTestRunFileWatcher= new ImportedTestRunFileWatcher(this::handleImportedTestRunFileChanged);\n\n"
              "\t\tfRerunLastTestAction= new RerunLastAction();",
          )
          replace_once(
              view,
              "\t\ttoolBar.add(fRerunFailedFirstAction);\n"
              "\t\ttoolBar.add(fStopAction);\n"
              "\t\ttoolBar.add(fViewHistory.createHistoryDropDownAction());\n",
              "\t\ttoolBar.add(fRerunFailedFirstAction);\n"
              "\t\ttoolBar.add(fStopAction);\n"
              "\t\ttoolBar.add(fReloadTestRunAction);\n"
              "\t\ttoolBar.add(fViewHistory.createHistoryDropDownAction());\n",
          )
          replace_once(
              view,
              "\t\tfActivateOnErrorAction= new ActivateOnErrorAction();\n"
              "\t\tviewMenu.add(fActivateOnErrorAction);\n"
              "\t\tfViewMenuListener= manager -> fActivateOnErrorAction.update();\n",
              "\t\tfActivateOnErrorAction= new ActivateOnErrorAction();\n"
              "\t\tviewMenu.add(fActivateOnErrorAction);\n"
              "\t\tviewMenu.add(new Separator());\n"
              "\t\tviewMenu.add(fReloadTestRunAction);\n"
              "\t\tviewMenu.add(fAutoReloadTestRunAction);\n"
              "\t\tfViewMenuListener= manager -> {\n"
              "\t\t\tfActivateOnErrorAction.update();\n"
              "\t\t\tupdateImportedTestRunActions();\n"
              "\t\t};\n",
          )
          replace_once(
              view,
              "\t\tfTestRunSession= testRunSession;\n"
              "\t\tfTestViewer.registerActiveSession(testRunSession);\n",
              "\t\tfTestRunSession= testRunSession;\n"
              "\t\tfTestViewer.registerActiveSession(testRunSession);\n"
              "\t\tupdateImportedTestRunActions();\n",
          )
          replace_once(
              view,
              "\t\tsetActiveTestRunSession(null);\n\n"
              "\t\tif (fProgressImages != null)\n",
              "\t\tsetActiveTestRunSession(null);\n"
              "\t\tif (fReloadTestRunJob != null) {\n"
              "\t\t\tfReloadTestRunJob.cancel();\n"
              "\t\t\tfReloadTestRunJob= null;\n"
              "\t\t}\n"
              "\t\tif (fImportedTestRunFileWatcher != null) {\n"
              "\t\t\tfImportedTestRunFileWatcher.close();\n"
              "\t\t\tfImportedTestRunFileWatcher= null;\n"
              "\t\t}\n\n"
              "\t\tif (fProgressImages != null)\n",
          )
          replace_once(
              view,
              "\tprivate class StopAction extends Action {\n",
              base64.b64decode("  ").decode("utf-8"),
          )

          messages = Path("org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/JUnitMessages.java")
          replace_once(messages, "Copyright (c) 2000, 2025 IBM Corporation and others.",
                       "Copyright (c) 2000, 2026 IBM Corporation and others.")
          replace_once(
              messages,
              "\tpublic static String TestRunnerViewPart_ImportTestRunSessionAction_title;\n"
              "\tpublic static String TestRunnerViewPart_ImportTestRunSessionFromURLAction_import_from_url;\n",
              "\tpublic static String TestRunnerViewPart_ImportTestRunSessionAction_title;\n"
              "\tpublic static String TestRunnerViewPart_reload_action_label;\n"
              "\tpublic static String TestRunnerViewPart_reload_action_tooltip;\n"
              "\tpublic static String TestRunnerViewPart_auto_reload_action_label;\n"
              "\tpublic static String TestRunnerViewPart_auto_reload_action_tooltip;\n"
              "\tpublic static String TestRunnerViewPart_reload_job_name;\n"
              "\tpublic static String TestRunnerViewPart_reload_success;\n"
              "\tpublic static String TestRunnerViewPart_reload_error_title;\n"
              "\tpublic static String TestRunnerViewPart_auto_reload_error;\n"
              "\tpublic static String TestRunnerViewPart_ImportTestRunSessionFromURLAction_import_from_url;\n",
          )

          properties = Path("org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/JUnitMessages.properties")
          replace_once(properties, "Copyright (c) 2000, 2025 IBM Corporation and others.",
                       "Copyright (c) 2000, 2026 IBM Corporation and others.")
          replace_once(
              properties,
              "TestRunnerViewPart_ImportTestRunSessionAction_error_title=Import Test Run\n"
              "TestRunnerViewPart_ImportTestRunSessionFromURLAction_import_from_url=Import from &URL...\n",
              "TestRunnerViewPart_ImportTestRunSessionAction_error_title=Import Test Run\n"
              "TestRunnerViewPart_reload_action_label=&Reload Test Run\n"
              "TestRunnerViewPart_reload_action_tooltip=Reload the imported test results from their source file\n"
              "TestRunnerViewPart_auto_reload_action_label=Reload Automatically When Source Changes\n"
              "TestRunnerViewPart_auto_reload_action_tooltip=Watch the imported test result file and reload it after changes\n"
              "TestRunnerViewPart_reload_job_name=Reloading imported JUnit test results\n"
              "TestRunnerViewPart_reload_success=Reloaded test results from {0}\n"
              "TestRunnerViewPart_reload_error_title=Reload Test Run\n"
              "TestRunnerViewPart_auto_reload_error=Could not watch test result file ''{0}'' for changes.\n"
              "TestRunnerViewPart_ImportTestRunSessionFromURLAction_import_from_url=Import from &URL...\n",
          )

          reload_test = Path("org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/ImportedTestRunReloadTest.java")
          reload_test.write_bytes(base64.b64decode(" "))

          suite = Path("org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/JUnitJUnitTests.java")
          replace_once(
              suite,
              "TestRunSessionSerializationTests3.class,\n"
              "TestRunSessionSerializationTests4.class,\n",
              "TestRunSessionSerializationTests3.class,\n"
              "TestRunSessionSerializationTests4.class,\n"
              "ImportedTestRunReloadTest.class,\n",
          )
          PY

          git diff --check

      - name: Build affected reactor
        run: >-
          mvn -B -ntp -U
          -Pbuild-individual-bundles
          -DskipTests=true
          -Dcompare-version-with-baselines.skip=true
          -pl org.eclipse.jdt.ui.tests
          -am install

      - name: Run affected JUnit tests
        run: >-
          xvfb-run --auto-servernum
          mvn -B -ntp
          -Pbuild-individual-bundles
          -Dcompare-version-with-baselines.skip=true
          -pl org.eclipse.jdt.ui.tests
          -Dtest=org.eclipse.jdt.junit.tests.ImportedTestRunReloadTest,org.eclipse.jdt.junit.tests.TestRunSessionSerializationTests3,org.eclipse.jdt.junit.tests.TestRunSessionSerializationTests4
          test

      - name: Commit verified implementation to feature branch
        shell: bash
        run: |
          git switch -C issue-3128-reload-imported-test-results 254e0a12c522f33432e91108d63257a71a42117b
          git diff --check
          git config user.name "Carsten Hammer"
          git config user.email "carsten.hammer@t-online.de"
          git add \
            org.eclipse.jdt.junit.core/META-INF/MANIFEST.MF \
            org.eclipse.jdt.junit.core/src/org/eclipse/jdt/internal/junit/model/JUnitModel.java \
            org.eclipse.jdt.junit.core/src/org/eclipse/jdt/internal/junit/model/TestRunSession.java \
            org.eclipse.jdt.junit/META-INF/MANIFEST.MF \
            org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/ImportedTestRunFileWatcher.java \
            org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/JUnitMessages.java \
            org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/JUnitMessages.properties \
            org.eclipse.jdt.junit/src/org/eclipse/jdt/internal/junit/ui/TestRunnerViewPart.java \
            org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/ImportedTestRunReloadTest.java \
            org.eclipse.jdt.ui.tests/ui/org/eclipse/jdt/junit/tests/JUnitJUnitTests.java
          git commit -m "Reload imported JUnit test results"
          git push --force-with-lease=refs/heads/issue-3128-reload-imported-test-results:254e0a12c522f33432e91108d63257a71a42117b \
            origin HEAD:issue-3128-reload-imported-test-results
